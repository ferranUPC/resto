<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RESTO task tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,0..100,0..1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #46341f; --card: #33241a; --card-hi: #40301f; --line: #a07d4c; --fg: #f1e3c8;
    --muted: #bea684; --dim: #85704f; --brass: #b08d57;
    --needs-triage: #dba63f; --ready: #6fa8c9; --specified: #ab8dc6; --ticketed: #5fb3a1;
    --done: #93b86c; --wontfix: #85704f; --needs-info: #db8b9c; --blocked: #8d7c69;
    --milestone: #f2c45c; --suite: #92b3c9; --validates: #bcae91;
    --in: #f2c45c; --out: #7fb8d9;
    --serif: "Fraunces", "Iowan Old Style", Georgia, serif;
    --text: "Alegreya Sans", "Gill Sans", "Trebuchet MS", sans-serif;
  }
  * { box-sizing: border-box; }
  /* Walnut: a warm vignette over long horizontal streaks of grain. The streaks are drawn once into a
     tile by the script (--grain) and sit on their own fixed layer, so panning never repaints them. */
  body { margin: 0; color: var(--fg); overflow: hidden; background-color: var(--bg);
    font: 14px/1.4 var(--text); }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    will-change: transform;
    background-image:
      radial-gradient(ellipse at 50% 40%, rgba(190,135,75,.2), transparent 75%),
      radial-gradient(ellipse at 50% 50%, transparent 65%, rgba(0,0,0,.28)),
      var(--grain, none); }
  #toolbar, #legend, #panel { background-image: linear-gradient(180deg, rgba(255,225,170,.06), rgba(0,0,0,.18));
    box-shadow: inset 0 1px 0 rgba(255,225,170,.14), 0 4px 14px rgba(0,0,0,.45); }
  #toolbar { position: fixed; top: 12px; left: 12px; z-index: 2; display: flex; gap: 10px;
    align-items: center; padding: 7px 12px; background-color: #2b1d13;
    border: 1px solid var(--line); border-radius: 8px; }
  #toolbar h1 { margin: 0 8px 0 0; font: 600 16px/1 var(--serif); font-variation-settings: "SOFT" 100, "WONK" 1;
    color: var(--milestone); letter-spacing: .01em; }
  #toolbar label, #toolbar button { color: var(--muted); font: 14px var(--text); cursor: pointer; }
  #toolbar label { display: flex; align-items: center; gap: 5px; }
  #toolbar button { background: rgba(0,0,0,.2); border: 1px solid var(--line); border-radius: 5px;
    padding: 2px 10px; }
  #toolbar button:hover, #toolbar label:hover { color: var(--fg); border-color: var(--brass); }
  #search-box { position: relative; }
  #search { width: 230px; background: rgba(0,0,0,.25); color: var(--fg); border: 1px solid var(--line);
    border-radius: 5px; padding: 3px 9px; font: 14px var(--text); }
  #search:focus { outline: none; border-color: var(--milestone); }
  #search::placeholder { color: var(--dim); }
  #results { position: absolute; top: calc(100% + 8px); left: 0; width: 420px; max-height: 60vh;
    overflow-y: auto; display: none; background-color: #2b1d13; border: 1px solid var(--line);
    border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.6); }
  #results.open { display: block; }
  #results div { display: flex; gap: 8px; align-items: baseline; padding: 5px 12px; cursor: pointer; }
  #results div.on, #results div:hover { background: rgba(176,141,87,.25); }
  #results .rid { font-weight: 700; color: var(--milestone); white-space: nowrap; }
  #results .rname { color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #results .rmeta { margin-left: auto; color: var(--dim); font-size: 12px; white-space: nowrap; }
  #results .none { color: var(--muted); cursor: default; }
  #legend { position: fixed; bottom: 12px; left: 12px; z-index: 2; display: flex; gap: 12px;
    flex-wrap: wrap; padding: 7px 14px; background-color: #2b1d13;
    border: 1px solid var(--line); border-radius: 8px; font-size: 13px; color: var(--muted); }
  #legend span { display: flex; align-items: center; gap: 5px; }
  #legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
  #legend i.ring { background: none; border: 2px solid; }
  #legend i.halo-key { background: none; border: 1.4px dashed var(--fg); opacity: .7; }
  #legend .sep { width: 1px; height: 12px; background: var(--line); }
  body.open svg { width: 66.667vw; }
  svg { width: 100vw; height: 100vh; display: block; user-select: none; cursor: grab; }
  svg.dragging { cursor: grabbing; }
  svg.dragging * { pointer-events: none; }
  text { font-family: var(--text); pointer-events: none; text-rendering: optimizeSpeed; }
  /* zoomed far out the small text is unreadable, so skip painting it */
  svg.far .ticket, svg.far .sub, svg.far .rail-sub, svg.far .bevel { display: none; }

  .node, .ticket, .chip { cursor: pointer; }
  .node.dag { cursor: default; }
  .card { fill: url(#plank); stroke: var(--line); stroke-width: 1.2; }
  .bevel { fill: none; stroke: rgba(255,228,180,.13); stroke-width: 1; pointer-events: none; }
  .tile { fill-opacity: .2; }
  .accent { stroke-width: 1.6; fill: none; }
  .name { fill: var(--fg); font: 600 13px var(--serif); font-variation-settings: "SOFT" 100; }
  .sub { fill: var(--muted); font-size: 12px; }
  .glyph { font-size: 15px; font-weight: 700; text-anchor: middle; }
  .node.blocked .name { fill: var(--muted); }
  .node.blocked .card { fill: url(#plank-dark); }
  .node.actionable .card { fill: url(#plank-hi); }
  .node.milestone .card { fill: url(#plank-gold); }
  .node.milestone .name { fill: var(--milestone); }
  .node.suite .card { stroke-dasharray: 4 3; }
  .node.validates .name { font-weight: 500; }
  .halo { fill: none; stroke: var(--fg); stroke-width: 1.4; stroke-opacity: .55; stroke-dasharray: 2 3; }
  .badge rect { stroke: var(--bg); stroke-width: 2; }
  .badge text { font-size: 10px; font-weight: 700; text-anchor: middle; }
  .badge.urgent rect { fill: #c9402f; }
  .badge.urgent text { fill: #fff3e0; letter-spacing: .04em; }
  .badge.mark rect { fill: #4a3826; }
  .badge.freeze rect { fill: #4a3a5c; }
  .badge.freeze text { fill: #e6d8f7; letter-spacing: .03em; }
  .ticket .urgent-dot { fill: #d6473a; }
  .node.lit .card { stroke-width: 1.8; stroke: var(--brass); }
  .node.selected .card { stroke-width: 2.2; stroke: var(--milestone); }
  .dimmed .node:not(.lit), .dimmed .chip:not(.lit) { opacity: .38; }
  .effort { fill: var(--fg); font: 600 13px var(--serif); font-variation-settings: "SOFT" 100;
    text-anchor: end; font-feature-settings: "lnum"; }
  .node.blocked .effort { fill: var(--muted); }
  #legend svg.hourglass-key { width: 10px; height: 14px; color: var(--brass); }
  .chip .card { fill: #46331f; filter: none; }
  .chip .name { font-size: 12px; font-weight: 500; fill: var(--muted); }
  .chip:hover .name, .chip.lit .name { fill: var(--fg); }
  .chip.lit .card { stroke: var(--out); }
  .ticket .pill { fill: rgba(0,0,0,.24); stroke: rgba(255,228,180,.07); }
  .ticket:hover .pill { fill: rgba(255,228,180,.1); }
  .ticket text { fill: var(--muted); font-size: 12px; }
  .ticket.done text { text-decoration: line-through; fill: var(--dim); }
  .band { fill: rgba(14,8,3,.55); }
  .rail { fill: rgba(14,8,3,.62); stroke: rgba(196,158,98,.55); stroke-width: 1.5; }
  .rail-mark { fill: var(--milestone); opacity: .85; }
  .rail-title { fill: var(--fg); font: 600 15px var(--serif); font-variation-settings: "SOFT" 100, "WONK" 1; }
  .rail-sub { fill: var(--muted); font-size: 13px; font-style: italic; }
  .rail-toggle { cursor: pointer; }
  .rail-toggle:hover .rail { fill: rgba(14,8,3,.45); }
  .band-label, .lane-label { fill: var(--brass); font: 600 13px var(--serif); }
  .lane-label { font-size: 15px; fill: var(--muted); }

  .edge { fill: none; stroke: #a88a5e; stroke-width: 1.5; opacity: .6; }
  .edge.transient { display: none; stroke-dasharray: 3 3; }
  .all-edges .edge.transient { display: inline; opacity: .25; }
  .edge.inferred { stroke-dasharray: 5 4; }
  .edge.hot { opacity: 1; stroke-width: 2.2; }
  .edge.hot.into { stroke: var(--in); }
  .edge.hot.out { stroke: var(--out); }
  .edge.hot.transient { display: inline; opacity: .9; }
  .dimmed .edge:not(.hot) { opacity: .14; }
  #arrows path { stroke: none; }

  #panel { position: fixed; top: 0; right: 0; width: 33.333vw; height: 100vh; z-index: 3;
    display: none; flex-direction: column; padding: 18px 20px; background-color: #22170f;
    border-left: 2px solid var(--line); font-size: 15px; }
  body.open #panel { display: flex; }
  #detail { flex: 1; min-height: 0; overflow-y: auto; padding-right: 4px; }
  #panel h2 { margin: 0 24px 4px 0; font: 600 20px/1.25 var(--serif); font-variation-settings: "SOFT" 100, "WONK" 1;
    color: var(--milestone); }
  #panel dl { margin: 12px 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; }
  #panel dt { color: var(--muted); }
  #panel dd { margin: 0; }
  #panel h3 { margin: 18px 0 6px; font: 600 15px var(--serif); color: var(--brass);
    border-bottom: 1px solid rgba(176,141,87,.3); padding-bottom: 3px; }
  #panel .notes { max-height: 45vh; overflow-y: auto; white-space: pre-wrap; }
  #panel a { color: #e3b96f; cursor: pointer; text-decoration: none; }
  #panel a:hover { text-decoration: underline; }
  #panel ul { margin: 0; padding-left: 18px; }
  #panel .actions { display: flex; gap: 8px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
  #panel button.launch { background: linear-gradient(180deg, #6b4a2b, #4f3620); color: var(--fg);
    border: 1px solid var(--brass); border-radius: 5px; padding: 4px 12px; cursor: pointer;
    font: 600 14px var(--text); box-shadow: inset 0 1px 0 rgba(255,228,180,.2); }
  #panel button.launch:hover { background: linear-gradient(180deg, #7d5732, #5d4025); }
  #panel button.launch.small { padding: 0 6px; margin-left: 8px; font-size: 11px; }
  #launch-status { font-size: 12px; color: var(--muted); }
  #close { position: absolute; top: 12px; right: 14px; background: none; border: 0;
    color: var(--muted); font-size: 20px; cursor: pointer; }

  #md-backdrop { position: fixed; inset: 0; z-index: 5; display: none; align-items: center;
    justify-content: center; background: rgba(8,5,2,.72); }
  body.md-open #md-backdrop { display: flex; }
  #md-modal { position: relative; width: min(1100px, 94vw); height: 92vh; display: flex; flex-direction: column;
    background-color: #22170f; border: 2px solid var(--line); border-radius: 10px;
    background-image: linear-gradient(180deg, rgba(255,225,170,.06), rgba(0,0,0,.18));
    box-shadow: inset 0 1px 0 rgba(255,225,170,.14), 0 12px 48px rgba(0,0,0,.7); }
  #md-bar { display: flex; align-items: center; gap: 10px; padding: 12px 18px;
    border-bottom: 1px solid rgba(176,141,87,.3); }
  #md-title { flex: 1; margin: 0; font: 600 18px/1.25 var(--serif); font-variation-settings: "SOFT" 100, "WONK" 1;
    color: var(--milestone); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #md-bar button { background: rgba(0,0,0,.2); color: var(--muted); border: 1px solid var(--line);
    border-radius: 5px; padding: 2px 10px; font: 14px var(--text); cursor: pointer; }
  #md-bar button:hover, #md-bar button.on { color: var(--fg); border-color: var(--brass); }
  #md-bar button.on { background: rgba(176,141,87,.25); }
  #md-body { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 32px 32px; font-size: 16px; line-height: 1.55; }
  #md-body h1, #md-body h2, #md-body h3, #md-body h4 { font-family: var(--serif); color: var(--brass);
    font-variation-settings: "SOFT" 100, "WONK" 1; line-height: 1.25; }
  #md-body h1 { color: var(--milestone); font-size: 26px; margin: 18px 0 10px; }
  #md-body h2 { font-size: 20px; margin: 26px 0 8px; border-bottom: 1px solid rgba(176,141,87,.3); padding-bottom: 3px; }
  #md-body h3 { font-size: 17px; margin: 20px 0 6px; }
  #md-body h4 { font-size: 15px; margin: 16px 0 4px; }
  #md-body p { margin: 8px 0; }
  #md-body ul, #md-body ol { margin: 6px 0; padding-left: 24px; }
  #md-body a { color: #e3b96f; }
  #md-body code { font: 13.5px ui-monospace, Menlo, monospace; background: rgba(0,0,0,.3);
    padding: 1px 5px; border-radius: 4px; }
  #md-body pre { background: rgba(0,0,0,.35); border: 1px solid rgba(176,141,87,.2); border-radius: 6px;
    padding: 10px 14px; overflow-x: auto; }
  #md-body pre code { background: none; padding: 0; }
  #md-body blockquote { margin: 8px 0; padding: 2px 14px; border-left: 3px solid var(--brass); color: var(--muted); }
  #md-body table { border-collapse: collapse; margin: 10px 0; font-size: 14.5px; }
  #md-body th, #md-body td { border: 1px solid rgba(176,141,87,.3); padding: 4px 10px; vertical-align: top; }
  #md-body th { background: rgba(0,0,0,.25); text-align: left; }
  #md-body hr { border: 0; border-top: 1px solid rgba(176,141,87,.3); margin: 18px 0; }
  #md-body.raw { white-space: pre-wrap; font: 13.5px/1.5 ui-monospace, Menlo, monospace; }
  #warning { position: fixed; bottom: 56px; left: 12px; right: 12px; color: #fbbf24; }
  #error { position: fixed; bottom: 8px; left: 12px; color: #f87171; }
</style>
</head>
<body>
<div id="toolbar">
  <h1>RESTO Tech Tree</h1>
  <label><input type="checkbox" id="show-done" checked> Completed</label>
  <label><input type="checkbox" id="all-edges"> All edges</label>
  <div id="search-box">
    <input id="search" type="search" placeholder="Search by ID or name  ( / )" autocomplete="off" spellcheck="false">
    <div id="results"></div>
  </div>
  <button id="fit">Fit</button>
  <button id="refresh" title="Re-read the specs and the tracker">Refresh</button>
</div>
<div id="legend"></div>
<svg id="canvas">
  <defs>
    <linearGradient id="plank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4028"/><stop offset="1" stop-color="#45311f"/></linearGradient>
    <linearGradient id="plank-hi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4d2f"/><stop offset="1" stop-color="#523a24"/></linearGradient>
    <linearGradient id="plank-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3826"/><stop offset="1" stop-color="#382819"/></linearGradient>
    <linearGradient id="plank-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5e2c"/><stop offset="1" stop-color="#5a4520"/></linearGradient>
    <!-- Effort mark: brass frame, glass bulbs, sand in currentColor (the card's accent). -->
    <symbol id="hourglass" viewBox="0 0 12 16">
      <path d="M2.2,2.4 C2.2,6 5.1,6.7 5.1,8 C5.1,9.3 2.2,10 2.2,13.6 H9.8 C9.8,10 6.9,9.3 6.9,8
        C6.9,6.7 9.8,6 9.8,2.4 Z" fill="rgba(255,228,180,.08)" stroke="#d9c39a" stroke-width=".8"
        stroke-linejoin="round"/>
      <path d="M3.5,4.9 C4.3,6.4 5.6,7 6,7.5 C6.4,7 7.7,6.4 8.5,4.9 Z" fill="currentColor" opacity=".75"/>
      <path d="M6,7.6 V11" stroke="currentColor" stroke-width=".45" stroke-linecap="round"/>
      <path d="M2.9,13.6 C3.3,11.7 4.8,10.9 6,10.7 C7.2,10.9 8.7,11.7 9.1,13.6 Z" fill="currentColor"/>
      <path d="M1.2,2 V14 M10.8,2 V14" stroke="#b08d57" stroke-width=".9" stroke-linecap="round"/>
      <rect x=".3" y=".6" width="11.4" height="1.9" rx=".9" fill="#c9a66b"/>
      <rect x=".3" y="13.5" width="11.4" height="1.9" rx=".9" fill="#c9a66b"/>
    </symbol>
  </defs>
  <defs id="arrows"></defs>
  <g id="viewport"></g>
</svg>
<div id="panel"><button id="close" title="Close">×</button><div id="detail"></div></div>
<div id="md-backdrop"><div id="md-modal">
  <div id="md-bar"><h2 id="md-title"></h2>
    <button id="md-rendered" class="on">Rendered</button><button id="md-raw">Raw</button>
    <button id="md-close" title="Close (Esc)">×</button></div>
  <div id="md-body"></div>
</div></div>
<div id="warning"></div>
<div id="error"></div>
<script>
// Grain tile: one random strength per row (blended with its neighbours) times a slow wave along the
// row. Whole wave cycles per row and wrapped rows make the tile seamless in both directions.
(function paintGrain() {
  try {
    const N = 512, c = document.createElement("canvas"); c.width = c.height = N;
    const ctx = c.getContext("2d"), img = ctx.createImageData(N, N);
    const rows = Array.from({ length: N }, Math.random);
    const phase = Array.from({ length: N }, () => Math.random() * 6.283);
    for (let y = 0; y < N; y++) {
      const s = (rows[(y + N - 1) % N] + 2 * rows[y] + rows[(y + 1) % N]) / 4;
      for (let x = 0; x < N; x++) {
        const wave = 0.5 + 0.25 * Math.sin(6.283 * 2 * x / N + phase[y])
          + 0.25 * Math.sin(6.283 * 5 * x / N + phase[(y + 7) % N]);
        const i = (y * N + x) * 4;
        img.data[i] = 14; img.data[i + 1] = 6; img.data[i + 2] = 0;
        img.data[i + 3] = Math.min(255, 130 * s * s * wave * 2);
      }
    }
    ctx.putImageData(img, 0, 0);
    document.body.style.setProperty("--grain", `url(${c.toDataURL()})`);
  } catch (err) { /* the flat walnut colour is enough without it */ }
})();
const NS = "http://www.w3.org/2000/svg";
const W = 272, H = 50, TILE = 44, GX = 96, GY = 16, DUMMY_H = 10, LANE_GAP = 120, TOP = 96;
const RAIL_HEAD = 34, RAIL_PAD = 14, RAIL_GAP = 14;
const RH = 22, ROW_GAP = 3, ROW_INSET = 10, ROWS_PAD = 8;
const CHIP_W = 206, CHIP_H = 28, CHIP_GAP = 8, CHIP_COLS = 3;
const EFFORT_UNIT = 4;
// Points are whole numbers, so points / 4 always lands on a quarter.
const effortLabel = points => {
  const whole = Math.floor(points / EFFORT_UNIT);
  const part = ["", "¼", "½", "¾"][points % EFFORT_UNIT];
  return whole || !part ? `${whole}${part}` : part;
};
const FINISHED = ["done", "wontfix"];
const DAG_KINDS = ["milestone", "suite", "validates"];
const GLYPHS = { "needs-triage": "○", ready: "▶", specified: "◆", ticketed: "≡", done: "✓",
  wontfix: "✕", "needs-info": "?", milestone: "⚑", suite: "▦", validates: "🏁" };
const LABELS = { "needs-triage": "needs triage", ready: "ready", specified: "specified",
  ticketed: "ticketed", done: "done", wontfix: "won't fix", "needs-info": "needs info" };
const color = s => `var(--${s})`;
// One border color per epic, cycled by epic number. Tasks outside an epic (refactors) stay neutral.
const EPIC_COLORS = ["#d9695a", "#dba63f", "#b5c25a", "#93b86c", "#5fb3a1", "#6fa8c9", "#ab8dc6",
  "#d98aa8", "#bea684"];
const epicColor = id => {
  const m = /^[A-Za-z]+(\d+)\./.exec(id);
  return m ? EPIC_COLORS[(+m[1] - 1 + EPIC_COLORS.length) % EPIC_COLORS.length] : "#85704f";
};
const MARKS = { awaiting: ["⏳", "awaiting measurement"], blocked: ["🚧", "blocked externally"] };
const isDag = n => DAG_KINDS.includes(n.kind);
const accentOf = (item, stages) => isDag(item) ? item.kind
  : item.blocked && !FINISHED.includes(item.stage) ? "blocked"
  : stages.includes(item.stage) ? item.stage : "needs-triage";

function el(name, attrs, parent) {
  const e = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
const truncate = (t, max) => t.length > max ? t.slice(0, max - 1) + "…" : t;

/* ---------- layout ---------- */

// Every rail folds. `collapsed` in the data is the default (refactors, unscheduled); a click flips it.
const flippedRails = new Set();
const isFolded = meta => Boolean(meta.collapsed) !== flippedRails.has(meta.id);
function toggleRail(id) { flippedRails.has(id) ? flippedRails.delete(id) : flippedRails.add(id); draw(); }

// Rail header: the milestone name, then its target and deadline from the work plan's table.
function drawRailHead(parent, meta, y, prefix, extra) {
  const title = prefix + meta.name;
  el("rect", { class: "rail-mark", x: originXOf(), y: y + 10, width: 3, height: 16, rx: 1.5 }, parent);
  el("text", { class: "rail-title", x: originXOf() + 16, y: y + 23 }, parent)
    .textContent = truncate(title, 60);
  const dates = [meta.target && `target ${meta.target}`, meta.deadline && `deadline ${meta.deadline}`, extra]
    .filter(Boolean).join(" · ");
  if (dates)
    el("text", { class: "rail-sub", x: originXOf() + 16 + Math.min(title.length, 60) * 8.6 + 14, y: y + 23 },
      parent).textContent = dates;
}
let railOriginX = 0;
const originXOf = () => railOriginX - 16;

// Layered layout: real nodes keep the server's column; an edge that skips columns gets one thin
// dummy slot in each column it crosses, so it travels through the gap between two cards.
function layoutActive(nodes, edges, heightOf, folded) {
  const railCount = Math.max(1, folded.size ? Math.max(...folded) + 1 : 0, ...nodes.map(n => (n.rail ?? 0) + 1));
  const layers = [], items = new Map();
  const add = (item) => {
    (layers[item.col] ??= []).push(item); items.set(item.id, item); return item;
  };
  for (const n of nodes) add({ id: n.id, col: n.column, h: heightOf(n), pos: n.row, rail: n.rail ?? 0, node: n,
    preds: [], succs: [] });
  const routes = [];
  for (const e of edges) {
    const a = items.get(e.from), b = items.get(e.to);
    if (!a || !b) continue;
    const chain = [a];
    if (b.col > a.col) {
      for (let c = a.col + 1; c < b.col; c++)
        chain.push(add({ id: `${e.from}>${e.to}@${c}`, col: c, h: DUMMY_H, pos: a.pos,
          dummy: true, rail: a.rail, preds: [], succs: [] }));
    }
    chain.push(b);
    chain.forEach((it, i) => { if (i) { it.preds.push(chain[i - 1]); chain[i - 1].succs.push(it); } });
    routes.push({ edge: e, chain, forward: b.col > a.col });
  }
  for (const layer of layers) layer?.sort((p, q) => p.rail - q.rail || p.pos - q.pos);
  const reindex = () => layers.forEach(l => l?.forEach((it, i) => { it.pos = i; }));
  reindex();
  const mean = (list) => list.reduce((s, x) => s + x.pos, 0) / list.length;
  for (let pass = 0; pass < 6; pass++) {
    const down = pass % 2 === 0;
    const order = down ? layers.keys() : [...layers.keys()].reverse();
    for (const c of order) {
      const layer = layers[c]; if (!layer) continue;
      layer.forEach(it => {
        const ns = down ? it.preds : it.succs;
        it.bary = ns.length ? mean(ns) : it.pos;
      });
      layer.sort((p, q) => p.rail - q.rail || p.bary - q.bary || p.pos - q.pos);
      layer.forEach((it, i) => { it.pos = i; });
    }
  }
  // Vertical placement. Each rail is a band as tall as its fullest column; inside it, items are
  // stacked, then pulled toward their neighbours' centres without leaving the band.
  const centre = it => it.y + (it.dummy ? it.h / 2 : H / 2);
  const gap = it => it.dummy ? GY / 2 : GY;
  const stackH = group => group.reduce((sum, it) => sum + it.h + gap(it), 0) - GY / 2;
  const groups = layers.map(layer => {
    const byRail = new Map();
    layer?.forEach(it => { if (!byRail.has(it.rail)) byRail.set(it.rail, []); byRail.get(it.rail).push(it); });
    return byRail;
  });
  const rails = [];
  let cursor = 0;
  for (let r = 0; r < railCount; r++) {
    const fullest = Math.max(0, ...groups.map(g => g.has(r) ? stackH(g.get(r)) : 0));
    const height = folded.has(r) ? RAIL_HEAD : fullest ? RAIL_HEAD + fullest + RAIL_PAD : 0;
    rails.push({ top: cursor, height });
    cursor += height + (height ? RAIL_GAP : 0);
  }
  groups.forEach(byRail => byRail.forEach((group, r) => {
    let y = rails[r].top + RAIL_HEAD;
    group.forEach(it => { it.y = y; y += it.h + gap(it); });
  }));
  for (let pass = 0; pass < 10; pass++) {
    const down = pass % 2 === 0;
    const order = down ? [...layers.keys()] : [...layers.keys()].reverse();
    for (const c of order) {
      groups[c]?.forEach((group, r) => {
        const lo = rails[r].top + RAIL_HEAD, hi = rails[r].top + rails[r].height - RAIL_PAD;
        const wants = group.map(it => {
          const ns = down ? it.preds : it.succs;
          const w = ns.length ? ns.reduce((sum, x) => sum + centre(x), 0) / ns.length : centre(it);
          return w - (it.dummy ? it.h / 2 : H / 2);
        });
        let floor = lo;
        group.forEach((it, i) => { it.y = Math.max(wants[i], floor); floor = it.y + it.h + gap(it); });
        // Keep the group inside its band: pull up from the bottom edge, then push down from the top.
        // The tightest stack always fits the band, so both passes can be satisfied.
        let ceil = hi;
        for (let i = group.length - 1; i >= 0; i--) {
          group[i].y = Math.min(group[i].y, ceil - group[i].h);
          ceil = group[i].y - gap(group[i]);
        }
        floor = lo;
        group.forEach(it => { it.y = Math.max(it.y, floor); floor = it.y + it.h + gap(it); });
      });
    }
  }
  return { layers, items, routes, rails };
}

// Right-angle path through the gap between columns, corners rounded with a small arc.
function roundedPath(points, r = 9) {
  const pts = points.filter((p, i) => !i || p[0] !== points[i - 1][0] || p[1] !== points[i - 1][1]);
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const [px, py] = pts[i - 1], [x, y] = pts[i], [nx, ny] = pts[i + 1];
    const l1 = Math.hypot(x - px, y - py), l2 = Math.hypot(nx - x, ny - y);
    const rr = Math.min(r, l1 / 2, l2 / 2);
    d += ` L${x - (x - px) / l1 * rr},${y - (y - py) / l1 * rr}`
      + ` Q${x},${y} ${x + (nx - x) / l2 * rr},${y + (ny - y) / l2 * rr}`;
  }
  const last = pts[pts.length - 1];
  return d + ` L${last[0]},${last[1]}`;
}

function epicOf(id) { const m = /^([A-Za-z]+\d+)\./.exec(id); return m ? m[1] : "Other"; }
const epicKey = e => { const m = /^([A-Za-z]+)(\d+)$/.exec(e); return m ? [m[1], +m[2]] : ["~", 0]; };

/* ---------- drawing ---------- */

let tree = null, view = null, selected = null;

function makeArrows() {
  const defs = document.getElementById("arrows"); defs.innerHTML = "";
  for (const [name, fillColor] of [["dim", "#a88a5e"], ["in", "#f2c45c"], ["out", "#7fb8d9"]]) {
    const m = el("marker", { id: `arrow-${name}`, viewBox: "0 0 10 10", refX: 9, refY: 5,
      markerWidth: 7, markerHeight: 7, orient: "auto" }, defs);
    el("path", { d: "M0,1 L10,5 L0,9 z", fill: fillColor }, m);
  }
}

function drawGlyph(g, item, accent, x, y) {
  if (item.blocked && !FINISHED.includes(item.stage) && !isDag(item)) {
    // small padlock
    el("rect", { x: x - 5, y: y - 1, width: 10, height: 8, rx: 1.5, fill: color(accent) }, g);
    el("path", { d: `M${x - 3},${y - 1} v-2.5 a3,3 0 0 1 6,0 v2.5`, fill: "none",
      stroke: color(accent), "stroke-width": 1.6 }, g);
    return;
  }
  const key = isDag(item) ? item.kind : item.stage;
  el("text", { class: "glyph", x, y: y + 5, fill: color(accent) }, g).textContent = GLYPHS[key] ?? "○";
}

function draw() {
  const g = document.getElementById("viewport"); g.innerHTML = "";
  const stages = tree.stages;
  const showDone = document.getElementById("show-done").checked;
  // A collapsible rail (refactors) shows only a header until it is opened.
  const folded = new Set(tree.rails.flatMap((r, i) => isFolded(r) ? [i] : []));
  const active = tree.nodes.filter(n => (showDone || !FINISHED.includes(n.stage)) && !folded.has(n.rail));
  const pendingIds = new Set(tree.nodes.filter(n => n.lane !== "done").map(n => n.id));
  // The frontier is the finished tasks that directly block a pending one. They sit next to the graph.
  const frontierIds = new Set(tree.edges.filter(e => pendingIds.has(e.to)).map(e => e.from));
  const done = tree.nodes.filter(n => n.lane === "done" && !frontierIds.has(n.id));
  const frontier = tree.nodes.filter(n => n.lane === "done" && frontierIds.has(n.id));
  const ticketsH = n => n.tickets.length ? n.tickets.length * RH + ROWS_PAD : 0;
  const heightOf = n => H + ticketsH(n);

  const pos = {}, chipEls = {};
  function drawChip(n, cx, cy) {
    pos[n.id] = { x: cx, y: cy, w: CHIP_W, h: CHIP_H };
    const chip = el("g", { class: "chip", transform: `translate(${cx},${cy})` }, g);
    chipEls[n.id] = chip;
    const accent = n.stage === "wontfix" ? "wontfix" : "done";
    el("rect", { class: "card", width: CHIP_W, height: CHIP_H, rx: 7 }, chip);
    el("text", { class: "glyph", x: 15, y: CHIP_H / 2 + 5, fill: color(accent),
      style: "font-size:12px" }, chip).textContent = GLYPHS[n.stage];
    el("text", { class: "name", x: 28, y: CHIP_H / 2 + 4 }, chip)
      .textContent = truncate(`${n.id}  ${n.name.replace(/`/g, "")}`, 27);
    el("title", {}, chip).textContent = `${n.id} ${n.name}\nstage: ${n.stage}` + (n.points ? `\npoints: ${n.points}` : "");
    chip.addEventListener("click", ev => { ev.stopPropagation(); if (!moved) select(n.id); });
    chip.addEventListener("mouseenter", () => highlight(n.id));
    chip.addEventListener("mouseleave", () => highlight(selected));
  }

  // Archive of finished tasks, grouped by epic, on the left.
  let archiveW = 0;
  if (showDone && done.length) {
    const groups = {};
    for (const n of done) (groups[epicOf(n.id)] ??= []).push(n);
    const epics = Object.keys(groups).sort((a, b) => {
      const [pa, na] = epicKey(a), [pb, nb] = epicKey(b); return pa < pb ? -1 : pa > pb ? 1 : na - nb;
    });
    archiveW = CHIP_COLS * (CHIP_W + CHIP_GAP) - CHIP_GAP + 24;
    el("text", { class: "lane-label", x: 12, y: TOP - 18 }, g).textContent = `Completed · ${done.length}`;
    let y = TOP;
    for (const epic of epics) {
      const list = groups[epic];
      const rows = Math.ceil(list.length / CHIP_COLS);
      const bandH = 22 + rows * (CHIP_H + CHIP_GAP) + 4;
      el("rect", { class: "band", x: 0, y, width: archiveW, height: bandH, rx: 8 }, g);
      el("text", { class: "band-label", x: 12, y: y + 15 }, g).textContent = epic;
      list.forEach((n, i) => drawChip(n, 12 + (i % CHIP_COLS) * (CHIP_W + CHIP_GAP),
        y + 22 + Math.floor(i / CHIP_COLS) * (CHIP_H + CHIP_GAP)));
      y += bandH + 10;
    }
  }

  // Pending graph.
  const ids = new Set(active.map(n => n.id));
  const activeEdges = tree.edges.filter(e => ids.has(e.from) && ids.has(e.to));
  const seen = new Set();
  const unique = activeEdges.filter(e => { const k = e.from + "|" + e.to;
    return seen.has(k) ? false : (seen.add(k), true); });
  const { layers, items, routes, rails } = layoutActive(active, unique, heightOf, folded);
  const showFrontier = showDone && frontier.length > 0;
  const frontX = showDone && done.length ? archiveW + LANE_GAP : 20;
  const originX = showFrontier ? frontX + CHIP_W + GX : frontX;
  const colX = c => originX + c * (W + GX);
  railOriginX = originX;
  const columns = layers.length;
  for (const it of items.values()) {
    it.x = colX(it.col); it.y += TOP;
    if (!it.dummy) pos[it.id] = { x: it.x, y: it.y, w: W, h: H };
  }
  if (showFrontier) {
    // Each chip sits at the mean height of the tasks it blocks, pushed down where two would overlap.
    const wanted = frontier.map(n => {
      const ys = tree.edges.filter(e => e.from === n.id && pos[e.to]).map(e => pos[e.to].y + H / 2);
      return { n, y: ys.length ? ys.reduce((a, b) => a + b) / ys.length : TOP };
    }).sort((a, b) => a.y - b.y);
    let floor = TOP;
    for (const w of wanted) {
      const y = Math.max(floor, w.y - CHIP_H / 2);
      drawChip(w.n, frontX, y);
      floor = y + CHIP_H + CHIP_GAP;
    }
    el("text", { class: "lane-label", x: frontX, y: TOP - 18 }, g).textContent = `Unblocking · ${frontier.length}`;
  }
  const railWidth = layers.length * (W + GX) - GX + 32;
  let railsBottom = 0;
  rails.forEach((rail, r) => {
    if (!rail.height) return;
    const meta = tree.rails[r] ?? { id: "unscheduled", name: "Unscheduled" };
    const y = rail.top + TOP;
    railsBottom = Math.max(railsBottom, y + rail.height);
    const rg = el("g", { class: "rail-toggle" }, g);
    el("rect", { class: "rail", x: originX - 16, y, width: railWidth, height: rail.height, rx: 12 }, rg);
    if (folded.has(r)) {
      const count = tree.nodes.filter(n => n.rail === r).length;
      drawRailHead(rg, meta, y, "▸ ", `${count} tasks, click to open`);
    } else drawRailHead(rg, meta, y, "▾ ");
    rg.addEventListener("click", () => toggleRail(meta.id));
  });

  // Edges first so cards paint over them.
  const edgeLayer = el("g", {}, g);
  const paths = [];
  const gaps = {};  // gap index -> [segment], to spread parallel vertical runs apart
  const segments = [];
  for (const r of routes) {
    r.segs = [];
    if (!r.forward) continue;
    r.chain.forEach((it, i) => {
      if (!i) return;
      const a = r.chain[i - 1], gap = a.col, seg = { a, b: it, gap };
      (gaps[gap] ??= []).push(seg); r.segs.push(seg); segments.push(seg);
    });
  }
  for (const list of Object.values(gaps)) {
    const moving = list.filter(s => portY(s.a) !== portY(s.b));
    moving.sort((p, q) => Math.sign(portY(p.b) - portY(p.a)) - Math.sign(portY(q.b) - portY(q.a))
      || portY(p.a) - portY(q.a));
    const n = moving.length, step = Math.min(7, (GX - 30) / Math.max(n, 1));
    moving.forEach((s, i) => { s.lane = (i - (n - 1) / 2) * step; });
  }
  function portY(it) { return it.y + (it.dummy ? it.h / 2 : H / 2); }
  for (const r of routes) {
    let d, cls = "edge";
    if (r.forward) {
      const pts = [];
      r.segs.forEach((s, i) => {
        const x1 = s.a.x + (s.a.dummy ? W : W), x2 = s.b.x;
        const trunk = x1 + GX / 2 + (s.lane ?? 0);
        if (i === 0) pts.push([s.a.x + W, portY(s.a)]);
        pts.push([trunk, portY(s.a)], [trunk, portY(s.b)], [x2, portY(s.b)]);
        if (s.b.dummy) pts.push([s.b.x + W, portY(s.b)]);
      });
      d = roundedPath(pts);
    } else {
      const a = items.get(r.edge.from), b = items.get(r.edge.to);
      d = curve({ x: a.x, y: a.y, w: W, h: H }, { x: b.x, y: b.y, w: W, h: H });
    }
    if (r.edge.inferred) cls += " inferred";
    const path = el("path", { class: cls, d, "marker-end": "url(#arrow-dim)" }, edgeLayer);
    paths.push({ path, from: r.edge.from, to: r.edge.to, transient: false });
  }
  function curve(a, b) {
    const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2;
    const dx = Math.max(60, Math.abs(x2 - x1) / 2);
    return `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
  }
  // Edges that touch a finished task only show when their node is hovered or selected.
  for (const e of tree.edges) {
    if (ids.has(e.from) && ids.has(e.to)) continue;
    if (!pos[e.from] || !pos[e.to]) continue;
    // Edges out of the frontier stay visible: they are the reason the chip is in the graph.
    const shown = showFrontier && frontierIds.has(e.from) && ids.has(e.to);
    const path = el("path", { class: "edge" + (shown ? "" : " transient") + (e.inferred ? " inferred" : ""),
      d: curve(pos[e.from], pos[e.to]), "marker-end": "url(#arrow-dim)" }, edgeLayer);
    paths.push({ path, from: e.from, to: e.to, transient: !shown });
  }

  // Cards.
  const nodeEls = {};
  for (const it of items.values()) {
    if (it.dummy) continue;
    const n = it.node, accent = accentOf(n, stages), dag = isDag(n);
    const cls = ["node", dag ? `dag ${n.kind}` : "", n.blocked && !dag ? "blocked" : "",
      !dag && !n.blocked ? "actionable" : ""].join(" ");
    const node = el("g", { class: cls, transform: `translate(${it.x},${it.y})` }, g);
    nodeEls[n.id] = node;
    const h = heightOf(n);
    el("rect", { class: "card", width: W, height: h, rx: 10 }, node);
    el("rect", { class: "bevel", x: 2.5, y: 2.5, width: W - 5, height: h - 5, rx: 8 }, node);
    if (n.frontier)
      el("rect", { class: "halo", x: -5, y: -5, width: W + 10, height: h + 10, rx: 14 }, node);
    el("rect", { class: "accent", width: W, height: h, rx: 10,
      stroke: dag ? color(accent) : epicColor(n.id),
      "stroke-opacity": n.blocked && !dag ? .4 : .85 }, node);
    el("path", { class: "tile", fill: color(accent),
      d: `M10,0 H${TILE} V${H} H10 a10,10 0 0 1 -10,-10 V10 a10,10 0 0 1 10,-10 z` }, node);
    el("line", { x1: TILE, x2: TILE, y1: 0, y2: H, stroke: color(accent), "stroke-opacity": .25 }, node);
    drawGlyph(node, n, accent, TILE / 2, H / 2 - 5);
    // A validates node closes tasks once its suite runs, so the flag replaces the plan's "✅" prefix.
    const lines = wrap(n.name.replace(/`/g, "").replace(/^✅\s*/, ""), 27, 2);
    const ty = lines.length === 1 ? H / 2 - 4 : H / 2 - 10;
    lines.forEach((ln, i) =>
      el("text", { class: "name", x: TILE + 10, y: ty + i * 14 }, node).textContent = ln);
    const sub = dag ? n.kind : `${n.id} · ${n.blocked ? "blocked" : LABELS[n.stage] ?? n.stage}`;
    el("text", { class: "sub", x: TILE + 10, y: H - 8 }, node).textContent = sub;
    if (n.points) {
      // Effort in the bottom-right corner: points / EFFORT_UNIT, then the hourglass.
      el("use", { href: "#hourglass", x: W - 21, y: H - 20, width: 11, height: 15,
        color: color(accent) }, node);
      el("text", { class: "effort", x: W - 25, y: H - 8 }, node).textContent = effortLabel(n.points);
    }
    if (!dag && n.warnings.length)
      el("text", { class: "sub", x: W - 12, y: 16, "text-anchor": "end", fill: "#fbbf24",
        style: "fill:#fbbf24" }, node).textContent = "!";
    // Badges sit on the card's top edge, right-aligned, so they never cover the name.
    const badges = [];
    if (n.urgent) badges.push({ cls: "urgent", label: "URGENT", w: 50 });
    if (n.tracker_mark) badges.push({ cls: "mark", label: MARKS[n.tracker_mark][0], w: 26 });
    if (n.after_freeze) badges.push({ cls: "freeze", label: "POST-FREEZE", w: 82 });
    let bx = W - 10;
    for (const b of badges) {
      bx -= b.w;
      const badge = el("g", { class: "badge " + b.cls, transform: `translate(${bx},-9)` }, node);
      el("rect", { width: b.w, height: 16, rx: 8 }, badge);
      el("text", { x: b.w / 2, y: 12 }, badge).textContent = b.label;
      bx -= 4;
    }
    const tip = el("title", {}, node);
    tip.textContent = [dag ? n.name : `${n.id} ${n.name}`, dag ? `kind: ${n.kind}` : `stage: ${n.stage}`,
      ...(!dag && epicOf(n.id) !== "Other" ? [`epic: ${epicOf(n.id)}`] : []),
      ...(n.frontier ? ["frontier: can start now"] : []),
      ...(n.urgent ? ["priority: urgent"] : []),
      ...(n.tracker_mark ? [`tracker: ${MARKS[n.tracker_mark][1]}`] : []),
      ...(n.points ? [`points: ${n.points}`] : []),
      ...(n.due ? [`due: ${n.due}` + (n.after_freeze ? " (after the feature freeze)" : "")] : []),
      ...n.warnings.map(w => "warning: " + w)].join("\n");
    n.tickets.forEach((t, i) => {
      const label = `${t.id}  ${t.name}`;
      const tacc = t.blocked && !FINISHED.includes(t.stage) ? "blocked"
        : stages.includes(t.stage) ? t.stage : "needs-triage";
      const row = el("g", { class: "ticket" + (FINISHED.includes(t.stage) ? " done" : ""),
        transform: `translate(${ROW_INSET},${H + ROW_GAP + i * RH})` }, node);
      el("rect", { class: "pill", width: W - 2 * ROW_INSET, height: RH - ROW_GAP, rx: 5 }, row);
      el("circle", { cx: 10, cy: (RH - ROW_GAP) / 2, r: 3.5, fill: color(tacc) }, row);
      if (t.urgent)
        el("circle", { class: "urgent-dot", cx: W - 2 * ROW_INSET - 10, cy: (RH - ROW_GAP) / 2, r: 3.5 }, row);
      el("text", { x: 20, y: RH / 2 + 1 }, row).textContent = truncate(label, 37);
      row.addEventListener("click", ev => { ev.stopPropagation(); if (!moved) showTicket(n.id, t.id); });
      el("title", {}, row).textContent = `${label}\nstage: ${t.stage}`
        + (t.blocked ? "\nblocked by: " + t.blocked_by.join(", ") : "") + (t.urgent ? "\npriority: urgent" : "");
    });
    if (!dag) node.addEventListener("click", ev => { ev.stopPropagation(); if (!moved) select(n.id); });
    node.addEventListener("mouseenter", () => highlight(n.id));
    node.addEventListener("mouseleave", () => highlight(selected));
  }

  const adj = new Map();
  for (const p of paths) for (const k of [p.from, p.to]) {
    if (!adj.has(k)) adj.set(k, []);
    adj.get(k).push(p);
  }
  view = { paths, adj, els: { ...nodeEls, ...chipEls }, lit: new Set(), hot: new Set(), sel: null,
    dimmed: false, pos, width: originX + columns * (W + GX),
    height: Math.max(railsBottom, ...Object.values(pos).map(p => p.y + p.h), 0) + 60 };
  canvas.classList.remove("dimmed");
  highlight(selected);
  applyEdgeMode();
}

// "Line one that fits" wrapping for SVG text: at most `lines` lines of `width` characters.
function wrap(text, width, lines) {
  const words = text.split(/\s+/), out = [""];
  for (const w of words) {
    const cur = out[out.length - 1];
    if ((cur + " " + w).trim().length <= width) out[out.length - 1] = (cur + " " + w).trim();
    else if (out.length < lines) out.push(w);
    else { out[out.length - 1] = truncate(cur + " " + w, width); break; }
  }
  return out.map(l => truncate(l, width));
}

// Hover events arrive in pairs (leave one card, enter the next), so the repaint waits for the frame
// and touches only the elements whose state changed.
let wanted = null, highlightFrame = 0;
function highlight(id) {
  wanted = id;
  if (!highlightFrame) highlightFrame = requestAnimationFrame(paintHighlight);
}

function paintHighlight() {
  highlightFrame = 0;
  if (!view) return;
  const id = wanted;
  const hot = new Set(id ? view.adj.get(id) ?? [] : []);
  const lit = new Set(id ? [id] : []);
  for (const p of hot) { lit.add(p.from); lit.add(p.to); }
  for (const p of view.hot) if (!hot.has(p)) paintPath(p, null);
  for (const p of hot) if (!view.hot.has(p)) paintPath(p, id);
  for (const nid of view.lit) if (!lit.has(nid)) view.els[nid]?.classList.remove("lit");
  for (const nid of lit) if (!view.lit.has(nid)) view.els[nid]?.classList.add("lit");
  if (view.sel !== selected) {
    view.els[view.sel]?.classList.remove("selected");
    view.els[selected]?.classList.add("selected");
    view.sel = selected;
  }
  const dimmed = !!id;
  if (view.dimmed !== dimmed) { canvas.classList.toggle("dimmed", dimmed); view.dimmed = dimmed; }
  view.hot = hot; view.lit = lit;
}

function paintPath(p, id) {
  const into = !!id && p.to === id, out = !!id && p.from === id;
  p.path.classList.toggle("hot", into || out);
  p.path.classList.toggle("into", into);
  p.path.classList.toggle("out", out);
  p.path.setAttribute("marker-end", `url(#arrow-${into ? "in" : out ? "out" : "dim"})`);
  if (into || out) p.path.parentNode.appendChild(p.path);  // paint hot edges over the rest
}

function applyEdgeMode() {
  canvas.classList.toggle("all-edges", document.getElementById("all-edges").checked);
}

function select(id) { selected = id; highlight(id); showTask(id); }

/* ---------- legend ---------- */

function drawLegend() {
  const legend = document.getElementById("legend"); legend.innerHTML = "";
  const entries = [...tree.stages.filter(s => s !== "done" && s !== "wontfix"), "blocked", "done",
    "milestone", "suite"];
  for (const s of entries) {
    const span = document.createElement("span");
    const dot = document.createElement("i"); dot.style.background = color(s);
    span.append(dot, LABELS[s] ?? s); legend.appendChild(span);
  }
  const sep = () => { const i = document.createElement("span"); i.className = "sep"; legend.appendChild(i); };
  sep();
  const key = (label, mark) => {
    const span = document.createElement("span"); span.append(mark, label); legend.appendChild(span);
  };
  const halo = document.createElement("i"); halo.className = "halo-key";
  key("frontier (can start now)", halo);
  key("awaiting measurement", "⏳");
  key("blocked externally", "🚧");
  key("urgent", Object.assign(document.createElement("b"), { textContent: "!", style: "color:#ef4444" }));
  sep();
  const epics = [...new Set(tree.nodes.filter(n => n.kind === "task").map(n => epicOf(n.id)))]
    .filter(e => e !== "Other").sort((a, b) => {
      const [pa, na] = epicKey(a), [pb, nb] = epicKey(b); return pa < pb ? -1 : pa > pb ? 1 : na - nb;
    });
  for (const e of epics) {
    const ring = document.createElement("i"); ring.className = "ring";
    ring.style.borderColor = epicColor(e + ".");
    key(e, ring);
  }
  sep();
  const glass = document.createElementNS(NS, "svg");
  glass.setAttribute("class", "hourglass-key");
  el("use", { href: "#hourglass" }, glass);
  key(`1 = ${EFFORT_UNIT} pts`, glass);
}

/* ---------- pan, zoom, fit ---------- */

let scale = 1, tx = 0, ty = 0, drag = null, moved = false;
const canvas = document.getElementById("canvas"), viewport = document.getElementById("viewport");
let applyFrame = 0;
function apply() {
  if (applyFrame) return;
  applyFrame = requestAnimationFrame(() => {
    applyFrame = 0;
    viewport.setAttribute("transform", `translate(${tx},${ty}) scale(${scale})`);
    canvas.classList.toggle("far", scale < 0.5);
  });
}
function fit() {
  if (!view) return;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  scale = Math.min(1, (w - 40) / view.width, (h - 120) / view.height);
  scale = Math.max(scale, 0.25);
  tx = 20; ty = 30; apply();
}
canvas.addEventListener("wheel", ev => {
  ev.preventDefault();
  // Zoom in proportion to how far the wheel moved, in pixels whatever the browser's delta unit:
  // a mouse notch is ~100 px (Firefox reports 3 lines), a trackpad sends many tiny deltas.
  const pixels = ev.deltaY * (ev.deltaMode === 1 ? 33 : ev.deltaMode === 2 ? 400 : 1);
  const speed = ev.ctrlKey ? 0.01 : 0.0015;  // a trackpad pinch arrives as ctrl+wheel
  const f = Math.exp(-Math.max(-120, Math.min(120, pixels)) * speed);
  const next = Math.min(2.5, Math.max(0.15, scale * f));
  const k = next / scale;
  tx = ev.clientX - (ev.clientX - tx) * k; ty = ev.clientY - (ev.clientY - ty) * k; scale = next; apply();
}, { passive: false });
canvas.addEventListener("mousedown", ev => {
  ev.preventDefault();
  drag = [ev.clientX - tx, ev.clientY - ty]; moved = false;
});
window.addEventListener("mouseup", () => { drag = null; canvas.classList.remove("dragging"); });
window.addEventListener("mousemove", ev => { if (drag) {
  const nx = ev.clientX - drag[0], ny = ev.clientY - drag[1];
  // The drag style turns off hover on the cards, so it starts only once the pointer really moves;
  // a plain click must keep its card as the event target.
  if (!moved && Math.abs(nx - tx) + Math.abs(ny - ty) > 3) { moved = true; canvas.classList.add("dragging"); }
  tx = nx; ty = ny; apply();
} });
canvas.addEventListener("click", () => { if (!moved && selected) { selected = null; highlight(null); } });
document.getElementById("fit").addEventListener("click", fit);
document.getElementById("show-done").addEventListener("change", () => { draw(); fit(); });
document.getElementById("all-edges").addEventListener("change", () => view && applyEdgeMode());

/* ---------- markdown viewer ---------- */

const escapeHtml = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function inlineMd(raw) {
  // Code spans and links are stashed first so emphasis markers inside them (snake_case URLs) stay literal.
  const stash = [];
  const keep = html => { stash.push(html); return `\u0000${stash.length - 1}\u0000`; };
  let s = escapeHtml(raw).replace(/`([^`]+)`/g, (_, c) => keep(`<code>${c}</code>`));
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, label, url) =>
    /^(https?:|mailto:|#)/.test(url) ? keep(`<a href="${url}" target="_blank" rel="noopener">`) + label + keep("</a>") : label);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^\w])__([^_]+)__(?!\w)/g, "$1<strong>$2</strong>")
    .replace(/~~([^~]+)~~/g, "<del>$1</del>")
    .replace(/(^|[^*\w])\*([^*\s][^*]*)\*(?!\w)/g, "$1<em>$2</em>")
    .replace(/(^|[^_\w])_([^_\s][^_]*)_(?!\w)/g, "$1<em>$2</em>");
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => stash[i]);
}
function renderMarkdown(src) {
  const lines = src.replace(/\r\n/g, "\n").split("\n"), out = [];
  const cells = l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    let m;
    if ((m = line.match(/^(\s*)(`{3,}|~{3,})/))) {
      const fence = m[2], buf = []; i++;
      while (i < lines.length && !lines[i].trim().startsWith(fence)) buf.push(lines[i++]);
      i++; out.push(`<pre><code>${escapeHtml(buf.join("\n"))}</code></pre>`);
    } else if (!line.trim()) { i++;
    } else if ((m = line.match(/^(#{1,4})\s+(.*)$/))) {
      out.push(`<h${m[1].length}>${inlineMd(m[2])}</h${m[1].length}>`); i++;
    } else if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { out.push("<hr>"); i++;
    } else if (/^\s*>/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ""));
      out.push(`<blockquote>${renderMarkdown(buf.join("\n"))}</blockquote>`);
    } else if (line.includes("|") && i + 1 < lines.length && /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(lines[i + 1])) {
      const head = cells(line); i += 2; const rows = [];
      while (i < lines.length && lines[i].includes("|") && lines[i].trim()) rows.push(cells(lines[i++]));
      out.push("<table><thead><tr>" + head.map(c => `<th>${inlineMd(c)}</th>`).join("") + "</tr></thead><tbody>"
        + rows.map(r => "<tr>" + r.map(c => `<td>${inlineMd(c)}</td>`).join("") + "</tr>").join("") + "</tbody></table>");
    } else if (/^\s*([-*+]|\d+\.)\s+/.test(line)) {
      const ordered = /^\s*\d+\./.test(line), items = [];
      while (i < lines.length && (/^\s*([-*+]|\d+\.)\s+/.test(lines[i]) || (/^\s+\S/.test(lines[i]) && items.length))) {
        const li = lines[i++].match(/^\s*([-*+]|\d+\.)\s+(.*)$/);
        if (li) items.push(li[2]); else items[items.length - 1] += " " + lines[i - 1].trim();
      }
      const tag = ordered ? "ol" : "ul";
      out.push(`<${tag}>` + items.map(t => `<li>${inlineMd(t.replace(/^\[( |x)\]\s/i, (_, c) => c === " " ? "\u2610 " : "\u2611 "))}</li>`).join("") + `</${tag}>`);
    } else {
      const buf = [];
      while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|\s*>|\s*(`{3,}|~{3,})|\s*([-*+]|\d+\.)\s)/.test(lines[i])) buf.push(lines[i++]);
      if (!buf.length) buf.push(lines[i++]);
      out.push(`<p>${inlineMd(buf.join(" "))}</p>`);
    }
  }
  return out.join("\n");
}
const mdBody = document.getElementById("md-body");
let mdSource = "";
function setMdMode(raw) {
  mdBody.className = raw ? "raw" : "";
  if (raw) mdBody.textContent = mdSource; else mdBody.innerHTML = renderMarkdown(mdSource);
  document.getElementById("md-rendered").classList.toggle("on", !raw);
  document.getElementById("md-raw").classList.toggle("on", raw);
  mdBody.scrollTop = 0;
}
function openMarkdown(title, source) {
  mdSource = source; document.getElementById("md-title").textContent = title;
  setMdMode(false); document.body.classList.add("md-open");
}
function closeMarkdown() { document.body.classList.remove("md-open"); }
document.getElementById("md-rendered").addEventListener("click", () => setMdMode(false));
document.getElementById("md-raw").addEventListener("click", () => setMdMode(true));
document.getElementById("md-close").addEventListener("click", closeMarkdown);
document.getElementById("md-backdrop").addEventListener("click", ev => { if (ev.target.id === "md-backdrop") closeMarkdown(); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeMarkdown(); });
function markdownButton(label, title, source, parent, small) {
  const b = document.createElement("button"); parent.insertBefore(b, parent.querySelector("#launch-status"));
  b.textContent = label; b.className = "launch" + (small ? " small" : "");
  b.addEventListener("click", ev => { ev.stopPropagation(); openMarkdown(title, source); }); return b;
}

/* ---------- side panel ---------- */

const detail = document.getElementById("detail");
function text(tag, content, parent) {
  const e = document.createElement(tag); e.textContent = content; parent.appendChild(e); return e;
}
function field(dl, label, value) {
  if (value === null || value === undefined || value === "" || (Array.isArray(value) && !value.length)) return;
  text("dt", label, dl); text("dd", Array.isArray(value) ? value.join(", ") : value, dl);
}
function link(label, onclick, parent) {
  const a = text("a", label, parent); a.addEventListener("click", onclick); return a;
}
async function load(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(r.status + " " + url);
  return r.json();
}
const NEXT_LABELS = { "needs-triage": "Triage", ready: "Grill and write spec", specified: "Split into tickets",
  ticketed: "Implement next ticket" };
async function launch(body) {
  const status = document.getElementById("launch-status");
  if (status) status.textContent = "Opening Terminal...";
  try {
    const r = await fetch("/api/launch", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body) });
    if (status) status.textContent = r.ok ? "Terminal opened." : await r.text();
  } catch (err) { if (status) status.textContent = "Launch failed: " + err; }
}
function actionsBar() {
  const bar = document.createElement("div"); bar.className = "actions"; detail.appendChild(bar);
  const status = text("span", "", bar); status.id = "launch-status";
  return bar;
}
function launchButton(label, body, parent, small) {
  const b = document.createElement("button"); parent.insertBefore(b, parent.querySelector("#launch-status"));
  b.textContent = label; b.className = "launch" + (small ? " small" : "");
  b.addEventListener("click", ev => { ev.stopPropagation(); launch(body); }); return b;
}
async function showTask(id) {
  document.body.classList.add("open");
  try {
    const d = await load("/api/task/" + encodeURIComponent(id));
    detail.innerHTML = "";
    text("h2", `${d.id} ${d.name}`, detail);
    const dl = document.createElement("dl"); detail.appendChild(dl);
    field(dl, "Stage", d.stage + (d.blocked ? " (blocked)" : ""));
    field(dl, "Blocked by", d.blocked_by);
    field(dl, "Points", d.points);
    field(dl, "Latest due", d.latest_due);
    field(dl, "Measured in", d.measured_in);
    field(dl, "Tracker", d.tracker_status);
    d.warnings.forEach(w => field(dl, "Warning", w));
    const actions = actionsBar();
    // A ticketed task with no takeable ticket has no next step, and the server would reject it.
    const takeable = d.tickets.some(t => !FINISHED.includes(t.stage) && !t.blocked);
    if (d.has_spec && NEXT_LABELS[d.stage] && (d.stage !== "ticketed" || takeable))
      launchButton(NEXT_LABELS[d.stage], { id: d.id, action: "next" }, actions);
    if (d.stage !== "done" && d.has_spec) launchButton("Grill", { id: d.id, action: "grill" }, actions);
    if (d.markdown) markdownButton("View spec", `${d.id} ${d.name} · spec.md`, d.markdown, actions);
    if (d.plan_excerpt) { text("h3", "Work plan", detail); text("div", d.plan_excerpt, detail); }
    if (d.tickets.length) {
      text("h3", "Tickets", detail);
      const ul = document.createElement("ul"); detail.appendChild(ul);
      for (const t of d.tickets) {
        const li = document.createElement("li"); ul.appendChild(li);
        link(`${t.id} - ${t.name}`, () => showTicket(d.id, t.id), li);
        text("span", ` (${t.stage})`, li);
        launchButton("Implement", { id: d.id, action: "ticket", ticket: t.id }, li, true);
      }
    }
    if (d.tracker_notes) { text("h3", "Tracker notes", detail); text("div", d.tracker_notes, detail).className = "notes"; }
  } catch (err) { detail.textContent = "Could not load the task: " + err; }
}
async function showTicket(taskId, ticketId) {
  document.body.classList.add("open");
  try {
    const d = await load(`/api/task/${encodeURIComponent(taskId)}/ticket/${encodeURIComponent(ticketId)}`);
    detail.innerHTML = "";
    link(`← ${d.task_id} ${d.task_name}`, () => showTask(d.task_id), detail);
    text("h2", `${d.id} - ${d.name}`, detail);
    const dl = document.createElement("dl"); detail.appendChild(dl);
    field(dl, "Status", d.stage + (d.blocked ? " (blocked)" : ""));
    field(dl, "Blocked by", d.blocked_by);
    const bar = actionsBar();
    launchButton("Implement", { id: d.task_id, action: "ticket", ticket: d.id }, bar);
    if (d.markdown) markdownButton("View ticket", `${d.task_id} · ${d.id} - ${d.name}`, d.markdown, bar);
    if (d.question) { text("h3", "Question", detail); text("div", d.question, detail).className = "notes"; }
  } catch (err) { detail.textContent = "Could not load the ticket: " + err; }
}
// Closing the panel also drops the selection, or the canvas stays dimmed around a task nobody is reading.
document.getElementById("close").addEventListener("click", () => {
  document.body.classList.remove("open");
  selected = null; highlight(null);
});

/* ---------- search ---------- */

const searchInput = document.getElementById("search"), resultsEl = document.getElementById("results");
let hits = [], activeHit = 0;
const normalize = t => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

// Every task and ticket whose ID or name contains all the typed words. An ID prefix ranks first.
function searchTree(query) {
  const words = normalize(query).split(/\s+/).filter(Boolean);
  if (!tree || !words.length) return [];
  const entries = [];
  for (const n of tree.nodes) {
    entries.push({ id: n.id, name: n.name, task: n.id, meta: isDag(n) ? n.kind : n.stage });
    for (const t of n.tickets)
      entries.push({ id: t.id, name: t.name, task: n.id, ticket: t.id, meta: `ticket · ${t.stage}` });
  }
  const first = normalize(query).trim();
  return entries
    .filter(e => { const hay = normalize(`${e.id} ${e.name}`); return words.every(w => hay.includes(w)); })
    .sort((a, b) => (normalize(b.id).startsWith(first) - normalize(a.id).startsWith(first))
      || (!!a.ticket - !!b.ticket))
    .slice(0, 30);
}

function renderResults() {
  resultsEl.innerHTML = "";
  if (!searchInput.value.trim()) { resultsEl.classList.remove("open"); return; }
  hits = searchTree(searchInput.value); activeHit = 0;
  if (!hits.length) text("div", "No matches", resultsEl).className = "none";
  hits.forEach((h, i) => {
    const row = text("div", "", resultsEl);
    if (!i) row.className = "on";
    text("span", h.id, row).className = "rid";
    text("span", h.name, row).className = "rname";
    text("span", h.meta, row).className = "rmeta";
    row.addEventListener("mousedown", ev => { ev.preventDefault(); goTo(h); });
  });
  resultsEl.classList.add("open");
}

function moveHit(delta) {
  if (!hits.length) return;
  const rows = resultsEl.children;
  rows[activeHit].classList.remove("on");
  activeHit = (activeHit + delta + hits.length) % hits.length;
  rows[activeHit].classList.add("on");
  rows[activeHit].scrollIntoView({ block: "nearest" });
}

// Unfold the task's rail and show finished tasks if they are hidden, then select it and centre on it.
function goTo(hit) {
  const node = tree.nodes.find(n => n.id === hit.task);
  if (!node) return;
  let redraw = false;
  const doneBox = document.getElementById("show-done");
  if (FINISHED.includes(node.stage) && !doneBox.checked) { doneBox.checked = true; redraw = true; }
  if (node.rail != null && tree.rails[node.rail] && isFolded(tree.rails[node.rail])) {
    flippedRails.has(tree.rails[node.rail].id) ? flippedRails.delete(tree.rails[node.rail].id)
      : flippedRails.add(tree.rails[node.rail].id);
    redraw = true;
  }
  if (redraw) draw();
  if (isDag(node)) { selected = null; highlight(node.id); } else select(node.id);
  if (hit.ticket) showTicket(node.id, hit.ticket);
  const p = view.pos[node.id];
  if (p) {
    const w = canvas.clientWidth;
    scale = Math.max(scale, 0.8);
    tx = w / (document.body.classList.contains("open") ? 3 : 2) - (p.x + W / 2) * scale;
    ty = canvas.clientHeight / 2 - (p.y + p.h / 2) * scale;
    apply();
  }
  searchInput.value = ""; resultsEl.classList.remove("open"); searchInput.blur();
}

searchInput.addEventListener("input", renderResults);
searchInput.addEventListener("focus", renderResults);
searchInput.addEventListener("blur", () => resultsEl.classList.remove("open"));
searchInput.addEventListener("keydown", ev => {
  if (ev.key === "ArrowDown") { ev.preventDefault(); moveHit(1); }
  else if (ev.key === "ArrowUp") { ev.preventDefault(); moveHit(-1); }
  else if (ev.key === "Enter" && hits[activeHit]) goTo(hits[activeHit]);
  else if (ev.key === "Escape") { searchInput.value = ""; searchInput.blur(); }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "/" && !/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName)) {
    ev.preventDefault(); searchInput.focus();
  }
});

makeArrows();
// The page reads the files on every load, so the frontier moves when a spec does and the button is pressed.
function loadTree(first) {
  return fetch("/api/tree").then(r => r.json()).then(t => {
      tree = t; drawLegend(); draw(); if (first) fit();
      document.getElementById("warning").textContent = tree.warnings.length
        ? "Work plan: " + tree.warnings.join("; ") : "";
      document.getElementById("error").textContent = "";
    })
    .catch(err => { document.getElementById("error").textContent = "Could not load the tree: " + err; });
}
document.getElementById("refresh").addEventListener("click", () => loadTree(false));
loadTree(true);
</script>
