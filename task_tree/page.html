<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RESTO task tree</title>
<style>
  :root {
    --bg: #14161a; --fg: #e8e8ea; --edge: #6b7280;
    --needs-triage: #b45309; --ready: #2563eb; --specified: #7c3aed; --ticketed: #0d9488;
    --done: #16a34a; --wontfix: #4b5563; --needs-info: #be185d; --blocked: #52525b;
    --milestone: #1f3b73; --suite: #3b5b9d; --result: #2f3542;
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px system-ui, sans-serif; }
  #legend { position: fixed; top: 8px; left: 8px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 1; }
  .chip { padding: 2px 8px; border-radius: 10px; color: #fff; font-size: 12px; }
  body.open svg { width: 66.667vw; }
  svg { width: 100vw; height: 100vh; display: block; user-select: none; cursor: grab; }
  svg.dragging { cursor: grabbing; }
  .node rect { stroke: rgba(255,255,255,.35); stroke-width: 1; }
  .node rect.frame { fill: #1c1f26; }
  .node text { fill: #fff; font-size: 12px; pointer-events: none; }
  .node.done { opacity: .4; }
  .node.suite rect.head { stroke-dasharray: 4 3; }
  .node.milestone text { font-weight: 600; }
  .node.dag { cursor: default; }
  .ticket rect { stroke: rgba(255,255,255,.2); }
  .ticket text { font-size: 11px; }
  .ticket.done { opacity: .5; }
  .edge { fill: none; stroke: var(--edge); stroke-width: 1.5; }
  .edge.done { opacity: .3; }
  .edge.inferred { stroke-dasharray: 5 4; }
  .node, .ticket { cursor: pointer; }
  #panel { position: fixed; top: 0; right: 0; width: 33.333vw; height: 100vh; box-sizing: border-box;
    display: none; flex-direction: column; padding: 14px 16px; background: #1c1f26;
    border-left: 1px solid #333844; }
  body.open #panel { display: flex; }
  #detail { flex: 1; min-height: 0; overflow-y: auto; }
  #panel h2 { margin: 0 0 6px; font-size: 15px; }
  #panel dl { margin: 8px 0; display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; }
  #panel dt { color: #9ca3af; }
  #panel dd { margin: 0; }
  #panel h3 { margin: 12px 0 4px; font-size: 12px; color: #9ca3af; text-transform: uppercase; }
  #panel .notes { max-height: 45vh; overflow-y: auto; white-space: pre-wrap; }
  #panel a { color: #93c5fd; cursor: pointer; text-decoration: underline; }
  #panel ul { margin: 0; padding-left: 18px; }
  #close { position: absolute; top: 10px; right: 12px; background: none; border: 0; color: #9ca3af;
    font-size: 18px; cursor: pointer; }
  #warning { position: fixed; bottom: 28px; left: 8px; right: 8px; color: #fbbf24; }
  #error { position: fixed; bottom: 8px; left: 8px; color: #f87171; }
</style>
</head>
<body>
<div id="legend"></div>
<svg id="canvas"><g id="viewport"></g></svg>
<div id="panel"><button id="close" title="Close">×</button><div id="detail"></div></div>
<div id="warning"></div>
<div id="error"></div>
<script>
const W = 260, H = 34, GX = 60, GY = 14, NS = "http://www.w3.org/2000/svg";
const RH = 22, ROW_GAP = 3, ROW_INSET = 10, ROWS_PAD = 6;
const FINISHED = ["done", "wontfix"];
const color = s => `var(--${s})`;
const DAG_KINDS = ["milestone", "suite", "result"];
const fill = (item, stages) => DAG_KINDS.includes(item.kind) ? color(item.kind) : item.blocked && item.stage !== "done" ? color("blocked")
  : color(stages.includes(item.stage) ? item.stage : "needs-triage");

function el(name, attrs, parent) {
  const e = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}

function truncate(text, max) { return text.length > max ? text.slice(0, max - 1) + "…" : text; }

function draw(tree) {
  const legend = document.getElementById("legend");
  legend.innerHTML = "";
  for (const s of [...tree.stages, "blocked", ...DAG_KINDS]) {
    const chip = document.createElement("span");
    chip.className = "chip"; chip.style.background = color(s); chip.textContent = s;
    legend.appendChild(chip);
  }
  const g = document.getElementById("viewport");
  g.innerHTML = "";
  const pos = {}, height = {}, nextY = {};
  for (const n of [...tree.nodes].sort((a, b) => a.column - b.column || a.row - b.row)) {
    height[n.id] = H + n.tickets.length * RH + (n.tickets.length ? ROWS_PAD : 0);
    const y = nextY[n.column] ?? 50;
    pos[n.id] = { x: 20 + n.column * (W + GX), y };
    nextY[n.column] = y + height[n.id] + GY;
  }
  for (const e of tree.edges) {
    const a = pos[e.from], b = pos[e.to];
    const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2, mx = (x1 + x2) / 2;
    el("path", { class: "edge" + (e.done ? " done" : "") + (e.inferred ? " inferred" : ""),
                 d: `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}` }, g);
  }
  for (const n of tree.nodes) {
    const p = pos[n.id];
    const node = el("g", { class: "node" + (n.stage === "done" ? " done" : "")
                             + (DAG_KINDS.includes(n.kind) ? ` dag ${n.kind}` : ""),
                           transform: `translate(${p.x},${p.y})` }, g);
    el("rect", { class: "frame", width: W, height: height[n.id], rx: 6 }, node);
    const dag = DAG_KINDS.includes(n.kind);
    el("rect", { class: "head", width: W, height: H, rx: n.kind === "milestone" ? H / 2 : 6,
                 fill: fill(n, tree.stages) }, node);
    const label = el("text", { x: 8, y: H / 2 + 4 }, node);
    label.textContent = truncate(dag ? n.name : `${n.id} ${n.name}`, 40);
    if (!dag) node.addEventListener("click", () => { if (!moved) showTask(n.id); });
    const title = el("title", {}, node);
    title.textContent = [dag ? n.name : `${n.id} ${n.name}`, dag ? `kind: ${n.kind}` : `stage: ${n.stage}`, ...n.warnings.map(w => "warning: " + w)].join("\n");
    n.tickets.forEach((t, i) => {
      const label = `${t.id} - ${t.name}`;
      const row = el("g", { class: "ticket" + (FINISHED.includes(t.stage) ? " done" : ""),
                            transform: `translate(${ROW_INSET},${H + ROW_GAP + i * RH})` }, node);
      el("rect", { width: W - 2 * ROW_INSET, height: RH - ROW_GAP, rx: 4, fill: fill(t, tree.stages) }, row);
      el("text", { x: 6, y: RH / 2 + 1 }, row).textContent = truncate(label, 38);
      row.addEventListener("click", ev => { ev.stopPropagation(); if (!moved) showTicket(n.id, t.id); });
      el("title", {}, row).textContent = `${label}\nstage: ${t.stage}`
        + (t.blocked ? "\nblocked by: " + t.blocked_by.join(", ") : "");
    });
  }
}

let scale = 1, tx = 0, ty = 0, drag = null, moved = false;
const canvas = document.getElementById("canvas"), viewport = document.getElementById("viewport");
const apply = () => viewport.setAttribute("transform", `translate(${tx},${ty}) scale(${scale})`);
canvas.addEventListener("wheel", ev => {
  ev.preventDefault();
  const f = ev.deltaY < 0 ? 1.1 : 1 / 1.1;
  tx = ev.clientX - (ev.clientX - tx) * f; ty = ev.clientY - (ev.clientY - ty) * f; scale *= f; apply();
}, { passive: false });
canvas.addEventListener("mousedown", ev => {
  ev.preventDefault();
  drag = [ev.clientX - tx, ev.clientY - ty]; moved = false; canvas.classList.add("dragging");
});
window.addEventListener("mouseup", () => { drag = null; canvas.classList.remove("dragging"); });
window.addEventListener("mousemove", ev => { if (drag) {
  const nx = ev.clientX - drag[0], ny = ev.clientY - drag[1];
  if (Math.abs(nx - tx) + Math.abs(ny - ty) > 3) moved = true;
  tx = nx; ty = ny; apply();
} });

const detail = document.getElementById("detail");
function text(tag, content, parent) {
  const e = document.createElement(tag); e.textContent = content; parent.appendChild(e); return e;
}
function field(dl, label, value) {
  if (value === null || value === undefined || value === "" || (Array.isArray(value) && !value.length)) return;
  text("dt", label, dl); text("dd", Array.isArray(value) ? value.join(", ") : value, dl);
}
function link(label, onclick, parent) {
  const a = text("a", label, parent); a.addEventListener("click", onclick); return a;
}
async function load(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(r.status + " " + url);
  return r.json();
}
async function showTask(id) {
  document.body.classList.add("open");
  try {
    const d = await load("/api/task/" + encodeURIComponent(id));
    detail.innerHTML = "";
    text("h2", `${d.id} ${d.name}`, detail);
    const dl = document.createElement("dl"); detail.appendChild(dl);
    field(dl, "Stage", d.stage + (d.blocked ? " (blocked)" : ""));
    field(dl, "Blocked by", d.blocked_by);
    field(dl, "Points", d.points);
    field(dl, "Latest due", d.latest_due);
    field(dl, "Measured in", d.measured_in);
    field(dl, "Tracker", d.tracker_status);
    d.warnings.forEach(w => field(dl, "Warning", w));
    if (d.plan_excerpt) { text("h3", "Work plan", detail); text("div", d.plan_excerpt, detail); }
    if (d.tickets.length) {
      text("h3", "Tickets", detail);
      const ul = document.createElement("ul"); detail.appendChild(ul);
      for (const t of d.tickets) {
        const li = document.createElement("li"); ul.appendChild(li);
        link(`${t.id} - ${t.name}`, () => showTicket(d.id, t.id), li);
        text("span", ` (${t.stage})`, li);
      }
    }
    if (d.tracker_notes) { text("h3", "Tracker notes", detail); text("div", d.tracker_notes, detail).className = "notes"; }
  } catch (err) { detail.textContent = "Could not load the task: " + err; }
}
async function showTicket(taskId, ticketId) {
  document.body.classList.add("open");
  try {
    const d = await load(`/api/task/${encodeURIComponent(taskId)}/ticket/${encodeURIComponent(ticketId)}`);
    detail.innerHTML = "";
    link(`← ${d.task_id} ${d.task_name}`, () => showTask(d.task_id), detail);
    text("h2", `${d.id} - ${d.name}`, detail);
    const dl = document.createElement("dl"); detail.appendChild(dl);
    field(dl, "Status", d.stage + (d.blocked ? " (blocked)" : ""));
    field(dl, "Blocked by", d.blocked_by);
    if (d.question) { text("h3", "Question", detail); text("div", d.question, detail).className = "notes"; }
  } catch (err) { detail.textContent = "Could not load the ticket: " + err; }
}
document.getElementById("close").addEventListener("click", () => document.body.classList.remove("open"));

fetch("/api/tree").then(r => r.json()).then(tree => {
    draw(tree);
    document.getElementById("warning").textContent = tree.warnings.length
      ? "Measurement DAG: " + tree.warnings.join("; ") : "";
  })
  .catch(err => { document.getElementById("error").textContent = "Could not load the tree: " + err; });
</script>
</body>
</html>
