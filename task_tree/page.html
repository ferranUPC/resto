<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RESTO task tree</title>
<style>
  :root {
    --bg: #14161a; --fg: #e8e8ea; --edge: #6b7280;
    --needs-triage: #b45309; --ready: #2563eb; --specified: #7c3aed; --ticketed: #0d9488;
    --done: #16a34a; --wontfix: #4b5563; --needs-info: #be185d; --blocked: #52525b;
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px system-ui, sans-serif; }
  #legend { position: fixed; top: 8px; left: 8px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 1; }
  .chip { padding: 2px 8px; border-radius: 10px; color: #fff; font-size: 12px; }
  svg { width: 100vw; height: 100vh; display: block; }
  .node rect { stroke: rgba(255,255,255,.35); stroke-width: 1; }
  .node rect.frame { fill: #1c1f26; }
  .node text { fill: #fff; font-size: 12px; pointer-events: none; }
  .node.done { opacity: .4; }
  .ticket rect { stroke: rgba(255,255,255,.2); }
  .ticket text { font-size: 11px; }
  .ticket.done { opacity: .5; }
  .edge { fill: none; stroke: var(--edge); stroke-width: 1.5; }
  .edge.done { opacity: .3; }
  #error { position: fixed; bottom: 8px; left: 8px; color: #f87171; }
</style>
</head>
<body>
<div id="legend"></div>
<svg id="canvas"><g id="viewport"></g></svg>
<div id="error"></div>
<script>
const W = 260, H = 34, GX = 60, GY = 14, NS = "http://www.w3.org/2000/svg";
const RH = 22, ROW_GAP = 3, ROW_INSET = 10, ROWS_PAD = 6;
const FINISHED = ["done", "wontfix"];
const color = s => `var(--${s})`;
const fill = (item, stages) => item.blocked && item.stage !== "done" ? color("blocked")
  : color(stages.includes(item.stage) ? item.stage : "needs-triage");

function el(name, attrs, parent) {
  const e = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}

function truncate(text, max) { return text.length > max ? text.slice(0, max - 1) + "…" : text; }

function draw(tree) {
  const legend = document.getElementById("legend");
  legend.innerHTML = "";
  for (const s of [...tree.stages, "blocked"]) {
    const chip = document.createElement("span");
    chip.className = "chip"; chip.style.background = color(s); chip.textContent = s;
    legend.appendChild(chip);
  }
  const g = document.getElementById("viewport");
  g.innerHTML = "";
  const pos = {}, height = {}, nextY = {};
  for (const n of [...tree.nodes].sort((a, b) => a.column - b.column || a.row - b.row)) {
    height[n.id] = H + n.tickets.length * RH + (n.tickets.length ? ROWS_PAD : 0);
    const y = nextY[n.column] ?? 50;
    pos[n.id] = { x: 20 + n.column * (W + GX), y };
    nextY[n.column] = y + height[n.id] + GY;
  }
  for (const e of tree.edges) {
    const a = pos[e.from], b = pos[e.to];
    const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2, mx = (x1 + x2) / 2;
    el("path", { class: "edge" + (e.done ? " done" : ""),
                 d: `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}` }, g);
  }
  for (const n of tree.nodes) {
    const p = pos[n.id];
    const node = el("g", { class: "node" + (n.stage === "done" ? " done" : ""),
                           transform: `translate(${p.x},${p.y})` }, g);
    el("rect", { class: "frame", width: W, height: height[n.id], rx: 6 }, node);
    el("rect", { width: W, height: H, rx: 6, fill: fill(n, tree.stages) }, node);
    const label = el("text", { x: 8, y: H / 2 + 4 }, node);
    label.textContent = truncate(`${n.id} ${n.name}`, 40);
    const title = el("title", {}, node);
    title.textContent = [`${n.id} ${n.name}`, `stage: ${n.stage}`, ...n.warnings.map(w => "warning: " + w)].join("\n");
    n.tickets.forEach((t, i) => {
      const label = `${t.id} - ${t.name}`;
      const row = el("g", { class: "ticket" + (FINISHED.includes(t.stage) ? " done" : ""),
                            transform: `translate(${ROW_INSET},${H + ROW_GAP + i * RH})` }, node);
      el("rect", { width: W - 2 * ROW_INSET, height: RH - ROW_GAP, rx: 4, fill: fill(t, tree.stages) }, row);
      el("text", { x: 6, y: RH / 2 + 1 }, row).textContent = truncate(label, 38);
      el("title", {}, row).textContent = `${label}\nstage: ${t.stage}`
        + (t.blocked ? "\nblocked by: " + t.blocked_by.join(", ") : "");
    });
  }
}

let scale = 1, tx = 0, ty = 0, drag = null;
const canvas = document.getElementById("canvas"), viewport = document.getElementById("viewport");
const apply = () => viewport.setAttribute("transform", `translate(${tx},${ty}) scale(${scale})`);
canvas.addEventListener("wheel", ev => {
  ev.preventDefault();
  const f = ev.deltaY < 0 ? 1.1 : 1 / 1.1;
  tx = ev.clientX - (ev.clientX - tx) * f; ty = ev.clientY - (ev.clientY - ty) * f; scale *= f; apply();
}, { passive: false });
canvas.addEventListener("mousedown", ev => { drag = [ev.clientX - tx, ev.clientY - ty]; });
window.addEventListener("mouseup", () => { drag = null; });
window.addEventListener("mousemove", ev => { if (drag) { tx = ev.clientX - drag[0]; ty = ev.clientY - drag[1]; apply(); } });

fetch("/api/tree").then(r => r.json()).then(draw)
  .catch(err => { document.getElementById("error").textContent = "Could not load the tree: " + err; });
</script>
</body>
</html>
