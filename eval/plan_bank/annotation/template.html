<title>RESTO Plan Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
:root {
  --bg: #F3F5F3;
  --surface: #FFFFFF;
  --sunk: #E9EDEA;
  --ink: #1B2320;
  --muted: #5C6964;
  --line: #D5DBD7;
  --accent: #17695A;
  --accent-ink: #FFFFFF;
  --accent-soft: #DDEEE8;
  --warn: #9A6206;
  --warn-soft: #FBEFD9;
  --ok: #2B7446;
  --ok-soft: #DDF0E2;
  --danger: #A33A2C;
  --focus: #2C8C77;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111614;
    --surface: #19201D;
    --sunk: #0D1110;
    --ink: #E4EBE7;
    --muted: #97A59F;
    --line: #2B3531;
    --accent: #5CC2A7;
    --accent-ink: #0E1A16;
    --accent-soft: #1B3730;
    --warn: #E4AE52;
    --warn-soft: #3A2D14;
    --ok: #7ACB93;
    --ok-soft: #1C3424;
    --danger: #EE8A7B;
    --focus: #7FD9C0;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111614;
  --surface: #19201D;
  --sunk: #0D1110;
  --ink: #E4EBE7;
  --muted: #97A59F;
  --line: #2B3531;
  --accent: #5CC2A7;
  --accent-ink: #0E1A16;
  --accent-soft: #1B3730;
  --warn: #E4AE52;
  --warn-soft: #3A2D14;
  --ok: #7ACB93;
  --ok-soft: #1C3424;
  --danger: #EE8A7B;
  --focus: #7FD9C0;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); padding-inline: 16px; padding-block: 0 48px; }
.wrap { max-width: 980px; margin-inline: auto; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
header.top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding-block: 14px 0; display: grid; gap: 12px; }
.brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; justify-content: space-between; }
.brand h1 { font-size: 18px; font-weight: 600; }
.brand h1 span { font-family: var(--mono); font-weight: 500; font-size: 13px; color: var(--muted); margin-left: 8px; }
.who { display: flex; align-items: center; gap: 8px; }
.who label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; }
nav.tabs button { border: 0; background: none; padding: 8px 14px 10px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.count { font-family: var(--mono); font-size: 12px; margin-left: 6px; color: var(--muted); font-variant-numeric: tabular-nums; }
main { padding-top: 20px; display: grid; gap: 16px; }
input[type="text"], input:not([type]), select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; min-width: 0; }
textarea { width: 100%; resize: vertical; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.filters { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; display: grid; gap: 10px; }
.card.accepted { border-left: 4px solid var(--ok); }
.card.corrected { border-left: 4px solid var(--warn); }
.card-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.card-head .id { font-family: var(--mono); font-weight: 500; }
.chip { font-size: 12px; font-weight: 500; padding: 2px 9px; border-radius: 99px; background: var(--sunk); color: var(--muted); }
.chip.flag { background: var(--warn-soft); color: var(--warn); }
.chip.changed { background: var(--accent-soft, var(--sunk)); color: var(--accent, var(--warn)); border: 1px solid currentColor; }
.chip.done { background: var(--ok-soft); color: var(--ok); }
.question { font-family: var(--serif); font-size: 19px; line-height: 1.45; margin: 0; overflow-wrap: anywhere; }
.facts { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 16px; }
ol.steps { margin: 0; padding-left: 26px; font-family: var(--mono); font-size: 12.5px; display: grid; gap: 2px; }
ol.steps li::marker { color: var(--muted); }
.verdict { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.verdict label { display: flex; gap: 6px; align-items: center; }
textarea.json { font-family: var(--mono); font-size: 12px; }
.err { color: var(--danger); font-size: 13px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; display: grid; gap: 12px; }
.hint { font-size: 13px; color: var(--muted); margin: 0; max-width: 70ch; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 24px; font-variant-numeric: tabular-nums; }
.stats b { font-size: 20px; font-weight: 600; display: block; }
.stats span { font-size: 12px; color: var(--muted); }
.toast { font-size: 13px; min-height: 1.4em; }
.toast.ok { color: var(--ok); }
.toast.err { color: var(--danger); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Plan review <span>RESTO · Planner gold</span></h1>
      <div class="who">
        <label for="reviewer">Reviewer</label>
        <input id="reviewer" type="text" placeholder="Your name or initials" autocomplete="off">
      </div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </header>
  <main id="main"></main>
</div>

<script>
const ITEMS = /*__ITEMS__*/[];
ITEMS.forEach((it) => { it.key = it.concept_id; });
const ALL = ITEMS;
const FORMAT = /*__FORMAT__*/"";
const SNAPSHOT_COMMIT = /*__SNAPSHOT_COMMIT__*/"";
const STORE_KEY = "resto-plan-review-v1";
const FLAG_HELP = {
  multi_arm: "more than one arm",
  derive_network: "derives a network",
  nested_arms: "compare with nested arms",
  no_demand_ref: "no demand_ref",
  network_only: "network-only question",
};

let state = { reviewer: "", tab: "phase0", onlyFlagged: false, onlyPending: false, onlyChanged: false, sort: "delicate", plans: {} };
const nChanged = () => ITEMS.filter((it) => it.changes.length).length;
/* ITEMS arrive delicate first; "changed" brings the changed plans to the top, "id" sorts by concept id. */
const SORTS = {
  delicate: ["Delicate first", null],
  changed: ["Changed since last review first", (a, b) => (b.changes.length > 0) - (a.changes.length > 0) || b.flags.length - a.flags.length || a.concept_id.localeCompare(b.concept_id)],
  id: ["Concept id", (a, b) => a.concept_id.localeCompare(b.concept_id)],
};
for (const it of ALL) state.plans[it.key] = { status: "pending", note: "", plan_text: JSON.stringify(it.plan, null, 2) };

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) state = Object.assign(state, JSON.parse(raw));
  } catch (e) { /* storage unavailable: start empty */ }
  for (const it of ALL) if (!state.plans[it.key]) state.plans[it.key] = { status: "pending", note: "", plan_text: JSON.stringify(it.plan, null, 2) };
}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ } }
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function parsePlan(text) {
  try { return { plan: JSON.parse(text) }; } catch (e) { return { error: String(e.message || e) }; }
}
const isReviewed = (p) => p.status === "accepted" || p.status === "corrected";
function reviewedCount(items = ITEMS) { return items.filter((it) => isReviewed(state.plans[it.key])).length; }

/* ---------- phase 0: the plans ---------- */
function cardHTML(it) {
  const p = state.plans[it.key];
  const q = it.question;
  const flags = it.flags.map((f) => `<span class="chip flag">${esc(FLAG_HELP[f] || f)}</span>`).join("");
  const changed = it.changes.length
    ? `<span class="chip changed" title="The gold fields differ from the plan you reviewed earlier (commit ${esc(SNAPSHOT_COMMIT)})">changed since last review</span>` : "";
  const changes = it.changes.length ? `<div class="facts changes"><span>changes: ${esc(it.changes.join("; "))}</span></div>` : "";
  let err = "";
  if (p.status === "corrected") { const r = parsePlan(p.plan_text); if (r.error) err = `<p class="err">The plan is not valid JSON: ${esc(r.error)}</p>`; }
  const editor = p.status === "corrected"
    ? `<label class="hint" for="plan-${esc(it.key)}">Edit the plan (full StudyPlan JSON). The apply step validates it with the plan's own invariants.</label>
       <textarea class="json" id="plan-${esc(it.key)}" rows="14" data-id="${esc(it.key)}" data-k="plan_text">${esc(p.plan_text)}</textarea>${err}`
    : "";
  return `<article class="card ${esc(p.status)}" id="card-${esc(it.key)}">
    <div class="card-head"><span class="id">${esc(it.concept_id)}</span><span class="chip">${esc(it.split)}</span>${flags}${changed}
      <span class="chip ${p.status === "pending" ? "" : "done"}" style="margin-left:auto">${esc(p.status)}</span></div>
    <p class="question">${esc(q.text)}</p>
    <div class="facts"><span>intent: <b>${esc(q.intent)}</b></span><span>network: ${esc(q.network_ref ?? "none")}</span><span>demand: ${esc(q.demand_ref ?? "none")}</span>
      <span>arms: ${esc(q.arms.join(", "))}</span>${q.contrasts.length ? `<span>contrasts: ${esc(q.contrasts.join(", "))}</span>` : ""}</div>
    ${changes}
    ${it.realised ? `<div class="facts"><span>already realised in phase 0: <b>${esc(it.realised.join(", "))}</b></span></div>` : ""}
    <ol class="steps">${it.steps.map((s) => `<li>${esc(s)}</li>`).join("")}</ol>
    <div class="verdict">
      <label><input type="radio" name="st-${esc(it.key)}" data-id="${esc(it.key)}" data-k="status" value="accepted" ${p.status === "accepted" ? "checked" : ""}> Accepted</label>
      <label><input type="radio" name="st-${esc(it.key)}" data-id="${esc(it.key)}" data-k="status" value="corrected" ${p.status === "corrected" ? "checked" : ""}> Corrected</label>
      <label><input type="radio" name="st-${esc(it.key)}" data-id="${esc(it.key)}" data-k="status" value="pending" ${p.status === "pending" ? "checked" : ""}> Pending</label>
    </div>
    <textarea rows="2" placeholder="Note (why it was corrected, what to look at)" data-id="${esc(it.key)}" data-k="note">${esc(p.note)}</textarea>
    ${editor}
  </article>`;
}
function phase0HTML() {
  const order = (SORTS[state.sort] || SORTS.delicate)[1];
  const shown = ITEMS.filter((it) => (!state.onlyFlagged || it.flags.length) && (!state.onlyChanged || it.changes.length) && (!state.onlyPending || state.plans[it.key].status === "pending"));
  if (order) shown.sort(order);
  return `<div class="panel"><p class="hint">All ${ITEMS.length} proposed plans, delicate ones first by default. ${nChanged()} of them changed since the review of commit ${esc(SNAPSHOT_COMMIT)} (a gold field moved: arms, step kinds or dependencies, derive_network modifications, demand_ref presence). Accept the plan as proposed, or mark it corrected and edit its JSON. Gold fields are step kinds and dependencies, the arm and role of each scenario, the modifications of each derive_network and whether demand_ref is present; free text is not gold.</p>
    <div class="filters"><label><input type="checkbox" data-f="onlyFlagged" ${state.onlyFlagged ? "checked" : ""}> Flagged only</label>
    <label><input type="checkbox" data-f="onlyChanged" ${state.onlyChanged ? "checked" : ""}> Changed since last review only</label>
    <label><input type="checkbox" data-f="onlyPending" ${state.onlyPending ? "checked" : ""}> Pending only</label>
    <label>Sort: <select data-sort="1">${Object.entries(SORTS).map(([k, [label]]) => `<option value="${k}" ${state.sort === k ? "selected" : ""}>${esc(label)}</option>`).join("")}</select></label>
    <span class="muted mono">${shown.length} shown, ${reviewedCount()} / ${ITEMS.length} reviewed</span></div></div>
    ${shown.map(cardHTML).join("") || '<div class="panel muted">Nothing to show with these filters.</div>'}`;
}

/* ---------- export ---------- */
function exportPayload() {
  const rows = (items) => items.map((it) => {
    const p = state.plans[it.key];
    const row = { concept_id: it.concept_id, status: p.status, note: p.note, plan: null };
    if (p.status === "corrected") { const r = parsePlan(p.plan_text); row.plan = r.plan ?? null; }
    return row;
  });
  return { format: FORMAT, reviewer: state.reviewer.trim(), exported_at: new Date().toISOString(), plans: rows(ITEMS) };
}
function exportHTML() {
  const p = exportPayload();
  const every = p.plans;
  const n = (s) => every.filter((r) => r.status === s).length;
  const badJson = every.filter((r) => r.status === "corrected" && !r.plan).length;
  return `<div class="panel"><h2 style="font-size:18px">Export</h2>
    <div class="stats"><div><b>${n("accepted")}</b><span>accepted</span></div><div><b>${n("corrected")}</b><span>corrected</span></div><div><b>${n("pending")}</b><span>pending</span></div></div>
    ${n("pending") ? `<p class="toast err">${n("pending")} plans are still pending: the apply step refuses a review that does not cover every one.</p>` : ""}
    ${badJson ? `<p class="toast err">${badJson} corrected plans have invalid JSON.</p>` : ""}
    ${state.reviewer.trim() ? "" : `<p class="toast err">Enter your name or initials at the top before exporting.</p>`}
    <p class="hint">Apply it with <code>python -m eval.plan_bank.annotation.review plan-review.json</code>.</p>
    <div class="row"><button class="btn primary" data-act="download">Download JSON</button><button class="btn" data-act="copy">Copy JSON</button></div>
    <p class="toast" id="export-toast"></p>
    <details><summary class="hint">Show the full JSON</summary><textarea id="export-text" rows="12" readonly class="mono" style="font-size:12px">${esc(JSON.stringify(p, null, 2))}</textarea></details></div>`;
}

const TABS = [["phase0", "Phase 0 plans"], ["export", "Export"]];
function render() {
  document.getElementById("tabs").innerHTML = TABS.map(([k, label]) =>
    `<button role="tab" data-tab="${k}" aria-selected="${state.tab === k}">${label}${k === "phase0" ? `<span class="count">${reviewedCount()}/${ITEMS.length}</span>` : ""}</button>`).join("");
  document.getElementById("main").innerHTML = state.tab === "phase0" ? phase0HTML() : exportHTML();
}

document.addEventListener("input", (ev) => {
  const el = ev.target;
  if (el.id === "reviewer") { state.reviewer = el.value; save(); return; }
  if (el.dataset && el.dataset.id && (el.dataset.k === "note" || el.dataset.k === "plan_text")) {
    state.plans[el.dataset.id][el.dataset.k] = el.value; save();
  }
});
document.addEventListener("change", (ev) => {
  const el = ev.target;
  if (el.dataset && el.dataset.sort) { state.sort = el.value; save(); render(); return; }
  if (el.dataset && el.dataset.f) { state[el.dataset.f] = el.checked; save(); render(); return; }
  if (el.dataset && el.dataset.k === "status") { state.plans[el.dataset.id].status = el.value; save(); render(); }
});
document.addEventListener("focusout", (ev) => {
  if (ev.target.dataset && ev.target.dataset.k === "plan_text") render();
});

function toast(text, kind) { const el = document.getElementById("export-toast"); if (el) { el.textContent = text; el.className = `toast ${kind || ""}`; } }
async function download(filename, data) {
  const dl = await downloadsP;
  if (!dl) { toast("Downloads are not available here: use Copy JSON.", "err"); return; }
  try { await dl.save({ filename, data }); toast(`Saved: ${filename}`, "ok"); }
  catch (e) { toast(e && e.code === "declined" ? "Download cancelled." : "Could not download: use Copy JSON.", e && e.code === "declined" ? "" : "err"); }
}
document.addEventListener("click", async (ev) => {
  const tabBtn = ev.target.closest("[data-tab]");
  if (tabBtn) { state.tab = tabBtn.dataset.tab; save(); render(); scrollTo({ top: 0 }); return; }
  const b = ev.target.closest("[data-act]");
  if (!b) return;
  const text = JSON.stringify(exportPayload(), null, 2);
  if (b.dataset.act === "download") await download("plan-review.json", text);
  if (b.dataset.act === "copy") {
    try { await navigator.clipboard.writeText(text); toast("JSON copied to the clipboard.", "ok"); }
    catch (e) { const ta = document.getElementById("export-text"); if (ta) { ta.parentElement.open = true; ta.select(); } toast("Could not copy automatically: copy the selected text.", "err"); }
  }
});

load();
document.getElementById("reviewer").value = state.reviewer;
render();
const use = (name) => (window.claude && window.claude.use ? window.claude.use(name).catch(() => null) : Promise.resolve(null));
const downloadsP = use("downloads");
</script>
