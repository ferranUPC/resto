# Evaluation cost data (E3.9). The single source every output (full plan, short version, page) reads.
# Edit this file, then run `python -m eval.budget`. No model names below the level scale, `derived_from` included
# (run ids are neutral): a level is a capability class; a level with `manifest` takes its price from config/prices.toml, one with
# `assumption` carries a price proposed by hand (USD per million tokens), to be settled by the maintainer.
#
# Conventions
# - A stage is one block of runs in one validation pass (V1 reduced on dev splits, V2 definitive).
#   Cost = inputs x repetitions x calls_per_input x models x (tokens in/out x level price), once with the
#   low tokens and once with the high tokens. `calls_per_input` counts agent runs per input; tokens are
#   per agent run (all model steps of the run added up).
# - `basis` is `measured` (the tokens come from a recorded run, named in `derived_from`) or `proxy`
#   (an estimate; `derived_from` says what it stands on).
# - The minimum tier uses only the default level (reasoning-low) and never fewer than the repetition floor
#   of the plan; the loader refuses it otherwise.
# - Free exploration (the page): each live suite has an `[suites.explore]` block with the bounds of the
#   inputs per pass (`min` to `max`; the planned tier is the default and must sit inside) and optional
#   `repetitions_max`, `models_max` and `review_minutes_low/high`. The reader picks inputs per pass, and
#   the models and repetitions per level. Tokens per run come from the runs the suite names at that
#   level; a level without a run takes the reasoning-low blocks with the output tokens times the level's
#   `output_factor`. V1 runs only the default level, at no more repetitions than the planned tier's V1.
#   The presets (minimum, planned, extended) are just configurations of these controls.
# - Contingency: per suite (`contingency`, a share of the suite's cost) and global (`global_contingency`,
#   a share of everything including the per-suite reserves).

[plan]
cap_usd = 30.0
global_contingency = 0.10
repetitions_max = 10  # most repetitions per level a reader may pick (the floor is 2)
models_max = 3  # most models per capability level a reader may pick

# ---- Capability levels (no model names; low-to-high within each family) --------------------------------

[levels.non-reasoning-low]
output_factor = 1.0
manifest = "google/gemma-3-12b-it"
policy = "pending policy approval"
approved_for = ["input-parser"]  # policy: Parser comparison runs only

[levels.non-reasoning-medium]
output_factor = 1.0
manifest = "meta-llama/llama-3.3-70b-instruct"
policy = "pending policy approval"

[levels.non-reasoning-high]
output_factor = 1.3
input_per_mtok = 2.00
output_per_mtok = 8.00
assumption = "OpenRouter list price of a frontier non-reasoning model, from memory; verify at openrouter.ai/models"
policy = "pending policy approval"

[levels.reasoning-low]
manifest = "deepseek/deepseek-v4.1-flash"  # the default model
policy = "approved"

[levels.reasoning-medium]
output_factor = 2.4
input_per_mtok = 1.10
output_per_mtok = 4.40
assumption = "OpenRouter list price of a mid-tier reasoning model, from memory; verify at openrouter.ai/models"
policy = "pending policy approval"

[levels.reasoning-high]
output_factor = 4.0
input_per_mtok = 3.00
output_per_mtok = 15.00
assumption = "OpenRouter list price of a frontier reasoning model, from memory; verify at openrouter.ai/models"
policy = "pending policy approval"

# ---- Suite: Input Parser -------------------------------------------------------------------------------
# Measured base: parser-benchmark run v8-dev (255 dev requests, 1 repetition, default model, mean 5381 input
# and 827 output tokens per run, $0.2112 real). Cross-check: v6-heldout (114 held-out requests x 3
# repetitions, mean 5118 / 553 tokens, $0.376). Measured stages carry the measured mean; the headroom above it
# (about +20 %, prompt growth, longer outputs on multi-arm requests) is a separate proxy stage.

[[suites]]
id = "input-parser"
name = "Input Parser"
measures = "Structured-output agreement of the Parser on the request bank: validity, intent, interventions, topology, metrics, ambiguity, arm structure, consistency across runs"
threshold = "DoD 4.1 (E5.1); N4: intent agreement >= 95 % over 3 runs on held-out"
varies = "repetitions"
contingency = 0.25
fixed = true

[suites.explore]
[suites.explore.inputs]
V1 = { min = 100, max = 500 }
V2 = { min = 60, max = 300 }

[[suites.tiers]]
name = "minimum"

[[suites.tiers.stages]]
pass = "V1"
inputs = 255
repetitions = 2
calls_per_input = 1
models = [{ level = "reasoning-low", count = 1 }]
tokens_in_low = 5381
tokens_in_high = 5381
tokens_out_low = 827
tokens_out_high = 827
basis = "measured"
derived_from = "v8-dev (255 dev requests, 1 repetition), mean tokens"

[[suites.tiers.stages]]
pass = "V1"
inputs = 255
repetitions = 2
calls_per_input = 1
models = [{ level = "reasoning-low", count = 1 }]
