# ---- Suite: EXP-01, Network Expert forced + free abstention --------------------------------------------
# Measured base: expert-benchmark run v2-e38-forced-1rep (117 questions, 1 repetition, forced mode,
# default model, 5,484,928 input and 283,445 output tokens in total = 46,880 / 2,423 per run, $0.993).
# Earlier full sweep v1-forced-1rep gives 45,120 / 2,629 per run ($0.976). Free mode has never been
# measured on a full sweep (e45-smoke: 4 questions, zero abstentions), so its tokens are a proxy of forced.
# The V1 checkpoint is a third of the bank (39 questions, an assumption to refine), so V1 stages are proxy. The shape is unfixed:
# free-mode repetitions are an open choice and the bank is rebuilt after ADR-0028 (eval/measurement-plans.md).

[[suites]]
id = "exp-01"
name = "Network Expert, forced and free abstention (EXP-01)"
measures = "Forced-mode accuracy across repetitions (N1) and whether the Expert abstains exactly where its forced answer would be wrong (N2), on the same 117 questions"
threshold = "DoD 4.7 per-family accuracy (E4.2-E4.4); abstention_recall >= 70 % and abstention_false_requests <= 30 % (E4.5)"
varies = "repetitions"
contingency = 0.20
fixed = false

[[suites.tiers]]
name = "minimum"

[[suites.tiers.stages]]
pass = "V1"
inputs = 39
repetitions = 2
calls_per_input = 1
models = [{ level = "reasoning-low", count = 1 }]
tokens_in_low = 45000
tokens_in_high = 55000
tokens_out_low = 2400
tokens_out_high = 3200
basis = "proxy"
derived_from = "v2-e38-forced-1rep tokens (forced mode, 117 questions x 1 repetition) on an assumed V1 size of 39 questions (a third of the bank); no V1 run"

