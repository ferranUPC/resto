# ---- Suite: EXP-01, Network Expert forced + free abstention --------------------------------------------
# Measured base: expert-benchmark run v2-e38-forced-1rep (117 questions, 1 repetition, forced mode,
# default model, 5,484,928 input and 283,445 output tokens in total = 46,880 / 2,423 per run, $0.993).
# Earlier full sweep v1-forced-1rep gives 45,120 / 2,629 per run ($0.976). Free mode has never been
# measured on a full sweep (e45-smoke: 4 questions, zero abstentions), so its tokens are a proxy of forced.
# The V1 checkpoint is a third of the bank (39 questions, an assumption to refine), so V1 stages are proxy. The shape is unfixed:
# free-mode repetitions are an open choice and the bank is rebuilt after ADR-0028 (eval/measurement-plans.md).

