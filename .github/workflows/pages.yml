name: Progress site

# Rebuilds the GitHub Pages progress site from docs/ on every push that touches it.
on:
  push:
    branches: [master]
    paths:
      - "docs/tfm-work-plan.md"
      - "docs/progress-tracker.md"
      - "docs/tfm-architecture-and-dod.md"
      - "progress-site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python progress-site/build_site.py _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
