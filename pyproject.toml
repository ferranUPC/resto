[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resto"
version = "0.1.0"
description = "Agentic Traffic Simulation Framework — TFM (FIB + DLR)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "eclipse-sumo==1.27.1",
    "sumolib==1.27.1",
    "traci==1.27.1",
    "mcp>=2,<3",  # v2 renamed FastMCP -> mcp.server.mcpserver.MCPServer; code here targets v2's API
    "openai>=1",  # ToolAgent's real client talks to OpenRouter via this SDK (base_url override)
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "jupyter",
    "pandas",
    "matplotlib",
]
fast = [
    "libsumo==1.27.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/resto"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "conformance", "verify", "eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# The architecture rests on structural Protocols (application/ports/) implemented by several
# adapters each; nothing but a type checker verifies those implementations actually line up.
# eval/dev-net/demand/sim_utils.py (E0.6, a notebook helper) is deliberately excluded: it was
# never written against mypy and fixing its untyped ElementTree navigation is a separate task -
# only the mypy-clean eval/ packages are listed here.
files = [
    "src", "tests", "conformance", "verify",
    "eval/scenario_matrix", "eval/benchmarks", "eval/question_bank", "eval/expert_benchmark",
]
check_untyped_defs = true
ignore_missing_imports = true  # traci / sumolib ship no type information

[tool.pytest.ini_options]
testpaths = ["tests", "conformance", "verify"]
addopts = "-ra"
